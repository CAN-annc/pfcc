<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>PFCC — 個人財務控制台</title>
<script src="/register-sw.js" defer></script>
<style>
/* ── Reset & base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:       #0F1B2D;
  --navy-mid:   #1A2E48;
  --navy-light: #243D5C;
  --blue:       #2563EB;
  --blue-soft:  #3B82F6;
  --surface:    #F7F8FA;
  --surface-2:  #EDEEF1;
  --border:     #DDE0E7;
  --border-2:   #C8CDD8;
  --text-1:     #111827;
  --text-2:     #4B5563;
  --text-3:     #9CA3AF;
  --green:      #059669;
  --green-bg:   #ECFDF5;
  --red:        #DC2626;
  --red-bg:     #FEF2F2;
  --amber:      #D97706;
  --amber-bg:   #FFFBEB;
  --sidebar-w:  220px;
  --header-h:   56px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'PingFang TC', 'Noto Sans TC', sans-serif;
  font-size: 14px;
  color: var(--text-1);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

/* ── Layout ───────────────────────────────────────────────────────────────── */
body { display: flex; min-height: 100dvh; }

.sidebar {
  width: var(--sidebar-w);
  min-height: 100dvh;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  z-index: 100;
  transition: transform .25s ease;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--navy-light);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-logo svg { flex-shrink: 0; }
.sidebar-logo-text { font-size: 13px; font-weight: 600; color: #E2E8F0; letter-spacing: .04em; }
.sidebar-logo-sub  { font-size: 10px; color: #64748B; margin-top: 1px; }

.nav { padding: 12px 0; flex: 1; overflow-y: auto; }
.nav-section {
  font-size: 10px; font-weight: 500; color: #475569;
  letter-spacing: .08em; padding: 16px 20px 6px;
  text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 20px;
  font-size: 13px; color: #94A3B8;
  cursor: pointer; border-left: 2px solid transparent;
  transition: background .15s, color .15s;
  text-decoration: none;
}
.nav-item:hover { background: var(--navy-light); color: #CBD5E1; }
.nav-item.active { color: #F1F5F9; background: var(--navy-mid); border-left-color: var(--blue-soft); }
.nav-item svg { flex-shrink: 0; opacity: .7; }
.nav-item.active svg { opacity: 1; }

.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}
.topbar {
  height: var(--header-h);
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-right  { display: flex; align-items: center; gap: 8px; }

.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1100px; }

/* ── Cards & surfaces ─────────────────────────────────────────────────────── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.card-total { font-size: 14px; font-weight: 600; color: var(--text-1); }

/* ── Net Worth hero ───────────────────────────────────────────────────────── */
.networth-card {
  background: var(--navy);
  border-radius: 12px;
  padding: 28px 28px 24px;
  color: #fff;
}
.networth-label {
  font-size: 12px; color: #94A3B8; font-weight: 500;
  letter-spacing: .04em; margin-bottom: 8px;
}
.networth-amount {
  font-size: 40px; font-weight: 300; letter-spacing: -1.5px;
  line-height: 1; color: #F1F5F9;
}
.networth-currency {
  font-size: 16px; font-weight: 400; color: #64748B; margin-right: 4px;
}
.networth-breakdown {
  display: flex; gap: 0;
  margin-top: 24px;
  border-top: 1px solid var(--navy-light);
  padding-top: 20px;
}
.networth-item { flex: 1; padding: 0 20px 0 0; }
.networth-item:not(:last-child) { border-right: 1px solid var(--navy-light); margin-right: 20px; }
.networth-item-label { font-size: 11px; color: #64748B; margin-bottom: 5px; }
.networth-item-value { font-size: 16px; font-weight: 500; color: #E2E8F0; }
.networth-item-sub   { font-size: 11px; color: #475569; margin-top: 2px; }

/* ── FX / data freshness ──────────────────────────────────────────────────── */
.freshness-bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 28px;
  background: var(--navy-mid);
  border-radius: 0 0 12px 12px;
  margin-top: -1px;
  font-size: 11px; color: #64748B;
}
.freshness-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.fresh   { background: #10B981; }
.stale   { background: var(--amber); }
.missing { background: var(--red); }

/* ── Expandable rows ──────────────────────────────────────────────────────── */
.section-row {
  display: flex; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
  user-select: none;
}
.section-row:last-child { border-bottom: none; }
.section-row:hover { background: var(--surface); }
.row-left  { display: flex; align-items: center; gap: 10px; flex: 1; }
.row-right { display: flex; align-items: center; gap: 12px; text-align: right; }
.row-label { font-size: 13px; font-weight: 500; }
.row-sub   { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.row-amount { font-size: 13px; font-weight: 600; }
.row-missing { font-size: 11px; color: var(--amber); }

.chevron {
  width: 16px; height: 16px; color: var(--text-3);
  transition: transform .2s ease; flex-shrink: 0;
}
.expanded .chevron { transform: rotate(90deg); }

/* ── Sub-rows (collapsed by default) ─────────────────────────────────────── */
.sub-rows { display: none; background: var(--surface); }
.sub-rows.open { display: block; }
.sub-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px 10px 44px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.sub-row-label { color: var(--text-2); }
.sub-row-right { display: flex; align-items: center; gap: 8px; text-align: right; }
.sub-row-amount { font-weight: 500; color: var(--text-1); }
.sub-row-original { font-size: 10px; color: var(--text-3); }

/* ── Currency badge ───────────────────────────────────────────────────────── */
.curr-badge {
  font-size: 10px; font-weight: 600; padding: 2px 6px;
  border-radius: 4px; letter-spacing: .03em; flex-shrink: 0;
}
.curr-TWD { background: #DCFCE7; color: #166534; }
.curr-USD { background: #DBEAFE; color: #1E40AF; }
.curr-JPY { background: #FEF9C3; color: #854D0E; }

/* ── Bank color dot ───────────────────────────────────────────────────────── */
.bank-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Icon circle ──────────────────────────────────────────────────────────── */
.icon-circle {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ic-blue   { background: #EFF6FF; color: var(--blue); }
.ic-green  { background: var(--green-bg); color: var(--green); }
.ic-amber  { background: var(--amber-bg); color: var(--amber); }
.ic-navy   { background: var(--navy-light); color: #93C5FD; }

/* ── Receivables notice ───────────────────────────────────────────────────── */
.recv-card {
  border: 1px solid #FDE68A;
  background: var(--amber-bg);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex; align-items: flex-start; gap: 12px;
}
.recv-card-body { flex: 1; }
.recv-card-title { font-size: 13px; font-weight: 600; color: #92400E; margin-bottom: 4px; }
.recv-card-desc  { font-size: 12px; color: #B45309; }

/* ── Stale / missing price badge ─────────────────────────────────────────── */
.stale-badge {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: var(--amber-bg); color: var(--amber);
}
.enter-price-btn {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border-2); background: #fff;
  cursor: pointer; color: var(--text-2);
}
.enter-price-btn:hover { background: var(--surface-2); }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: background .15s;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #1D4ED8; }
.btn-ghost   { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-icon    { padding: 7px; }

/* ── Data grid ────────────────────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ── Update time ──────────────────────────────────────────────────────────── */
.updated-at { font-size: 11px; color: var(--text-3); }

/* ── Modal overlay (price entry) ──────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 12px; padding: 24px;
  width: min(420px, 90vw); box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 6px; }
.modal input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border-2);
  border-radius: 7px; font-size: 14px;
  outline: none; transition: border-color .15s;
}
.modal input:focus { border-color: var(--blue); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ── Loading / skeleton ───────────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 4px;
  display: inline-block;
}
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

/* ── Responsive ───────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  .sidebar {
    transform: translateX(-220px);
    width: 220px;
  }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .content { padding: 16px; }
  .networth-breakdown { flex-direction: column; gap: 12px; }
  .networth-item:not(:last-child) { border-right: none; padding-right: 0; margin-right: 0; border-bottom: 1px solid var(--navy-light); padding-bottom: 12px; }
  .grid-2 { grid-template-columns: 1fr; }
  .networth-amount { font-size: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="7" fill="#2563EB" opacity=".15"/>
      <path d="M7 14h14M14 7v14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="3" fill="#3B82F6"/>
    </svg>
    <div>
      <div class="sidebar-logo-text">PFCC</div>
      <div class="sidebar-logo-sub">個人財務控制台</div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-section">總覽</div>
    <a class="nav-item active" href="#" data-view="assets">

      資產總覽
    </a>

    <div class="nav-section">記帳</div>

    </a>

    <div class="nav-section">管理</div>
    <a class="nav-item disabled" href="#" onclick="return false" style="opacity:.35;cursor:default">

    </a>
    <a class="nav-item disabled" href="#" onclick="return false" style="opacity:.35;cursor:default">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M7 21l5-5 5 5M7 3l5 5 5-5"/></svg>
      投資持倉
    </a>
  </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<div class="main">
  <header class="topbar">
    <button class="btn btn-ghost btn-icon" id="menuBtn" aria-label="選單" style="display:none">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title">資產總覽</span>
    <div class="topbar-right">
      <span class="updated-at" id="lastUpdated">載入中…</span>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="重新整理報價與匯率">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4 9a8 8 0 0115 3M20 15a8 8 0 01-15-3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯出備份" id="exportBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯入備份" id="importBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </button>
    </div>
  </header>

  <div class="content" id="content">
    <!-- rendered by JS -->
    <div style="color:var(--text-3);padding:40px 0;text-align:center">
      <div class="skeleton" style="width:200px;height:20px;margin:0 auto 12px"></div>
      <div class="skeleton" style="width:140px;height:14px;margin:0 auto"></div>
    </div>
  </div>
</div>

<!-- ── Balance edit modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="balanceModal">
  <div class="modal">
    <h2 id="balanceModalTitle">更新餘額</h2>
    <label id="balanceModalLabel">目前餘額</label>
    <input type="number" id="balanceModalInput" placeholder="輸入最新餘額" min="0" step="0.01">
    <div style="font-size:11px;color:var(--text-3);margin-top:6px">
      更新後將記錄最後確認時間，不影響交易紀錄。
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="balanceModalCancel">取消</button>
      <button class="btn btn-primary" id="balanceModalSave">確認更新</button>
    </div>
  </div>
</div>

<!-- ── Import backup modal ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>從備份匯入</h2>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6">
      選擇先前匯出的 <code style="background:var(--surface-2);padding:1px 5px;border-radius:3px">.json</code> 備份檔案。
      <strong>匯入後將覆蓋目前裝置上的所有資料。</strong>
    </p>
    <input type="file" id="importFile" accept=".json"
      style="font-size:13px;color:var(--text-2);border:1px dashed var(--border-2);
             border-radius:7px;padding:12px;width:100%;cursor:pointer">
    <div id="importStatus" style="font-size:12px;margin-top:8px;min-height:20px"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="importModalCancel">取消</button>
      <button class="btn btn-primary" id="importModalConfirm" disabled>匯入並覆蓋</button>
    </div>
  </div>
</div>

<!-- ── Price entry modal ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="priceModal">
  <div class="modal">
    <h2 id="priceModalTitle">輸入參考價格</h2>
    <label id="priceModalLabel">股票代號</label>
    <input type="number" id="priceModalInput" placeholder="輸入目前參考價格" min="0" step="0.01">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="priceModalCancel">取消</button>
      <button class="btn btn-primary" id="priceModalSave">儲存</button>
    </div>
  </div>
</div>

<script type="module">
import { openDB, seedIfNeeded, getAll, getOne, putOne, getSetting } from './db.js';
import { refreshPrices, refreshFxRates, getFxRates, setManualPrice } from './market.js';
import {
  calcCashAssets, calcDepositAssets, calcInvestmentAssets,
  calcReceivables, calcNetWorth,
  fmt, fmtCurrency, fmtDate, fmtDateTime, daysUntil, toTWD,
} from './calc.js';

// ─── Bootstrap ───────────────────────────────────────────────────────────────
let db, state = {};

async function init() {
  db = await openDB();
  await seedIfNeeded(db);
  await loadAndRender();
  await refreshMarketData();
}

async function loadAndRender() {
  const [banks, accounts, deposits, brokerages, holdings, goldHoldings,
         receivables, prices] = await Promise.all([
    getAll(db, 'banks'),
    getAll(db, 'accounts'),
    getAll(db, 'time_deposits'),
    getAll(db, 'brokerages'),
    getAll(db, 'holdings'),
    getAll(db, 'gold_holdings'),
    getAll(db, 'receivables'),
    getAll(db, 'market_prices'),
  ]);

  const fxRates = await getFxRates(db);

  const cash       = calcCashAssets(accounts, banks, fxRates);
  const depositRes = calcDepositAssets(deposits, banks, fxRates);
  const inv        = calcInvestmentAssets(holdings, brokerages, prices, fxRates);
  const recv       = calcReceivables(receivables);
  const netWorth   = calcNetWorth({
    cashTWD: cash.totalTWD,
    depositTWD: depositRes.totalTWD,
    investmentTWD: inv.totalTWD,
  });

  state = { banks, accounts, deposits, brokerages, holdings, prices,
            goldHoldings, receivables, fxRates, cash, depositRes, inv, recv, netWorth };

  renderDashboard(state);
  updateLastUpdated(fxRates);
}

async function refreshMarketData() {
  const { holdings } = state;
  const btn = document.getElementById('refreshBtn');
  btn.style.opacity = '.4';
  btn.style.pointerEvents = 'none';

  await Promise.allSettled([
    refreshFxRates(db),
    refreshPrices(db, holdings),
  ]);

  btn.style.opacity = '';
  btn.style.pointerEvents = '';
  await loadAndRender();
}

// ─── Render ───────────────────────────────────────────────────────────────────

function renderDashboard({ netWorth, cash, depositRes, inv, recv, fxRates }) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  // Net Worth hero
  content.appendChild(renderNetWorth(netWorth, cash, depositRes, inv, fxRates));

  // Receivables notice (if any pending)
  if (recv.pending.length > 0) {
    content.appendChild(renderReceivables(recv));
  }

  // Cash assets
  content.appendChild(renderCashSection(cash, fxRates));

  // Time Deposits
  if (depositRes.items.length > 0) {
    content.appendChild(renderDepositsSection(depositRes));
  }

  // Investments
  content.appendChild(renderInvestmentSection(inv));
}

// ── Net Worth card ─────────────────────────────────────────────────────────

function renderNetWorth(netWorth, cash, depositRes, inv, fxRates) {
  const wrap = el('div');

  const card = el('div', 'networth-card');
  card.innerHTML = `
    <div class="networth-label">總資產（折合台幣）</div>
    <div class="networth-amount">
      <span class="networth-currency">NT$</span>${fmt(netWorth)}
    </div>
    <div class="networth-breakdown">
      <div class="networth-item">
        <div class="networth-item-label">現金 &amp; 存款</div>
        <div class="networth-item-value">NT$ ${fmt(cash.totalTWD)}</div>
        <div class="networth-item-sub">${Object.entries(cash.byCurrency)

  const isStale = fxRates.is_stale;
  bar.innerHTML = `
    <span class="freshness-dot ${isStale ? 'stale' : 'fresh'}"></span>
    <span>匯率更新：${usdAge}</span>

  return wrap;
}

// ── Cash section ───────────────────────────────────────────────────────────

function renderCashSection(cash, fxRates) {
  const card = el('div', 'card');

  const header = el('div', 'card-header');
  header.innerHTML = `
    <div class="card-title">
      <div class="icon-circle ic-blue">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      現金 &amp; 銀行帳戶
    </div>
    <div class="card-total">NT$ ${fmt(cash.totalTWD)}</div>
  `;
  card.appendChild(header);

  // Group by bank, sorted by sort_order
  const bankGroups = Object.values(cash.byBank).sort(
    (a, b) => (a.bank.sort_order ?? 99) - (b.bank.sort_order ?? 99)
  );

  // Currency summary row first
  const currRows = Object.entries(cash.byCurrency).filter(([,v]) => v > 0);
  if (currRows.length > 1) {
    const summaryRow = el('div', 'section-row');
    summaryRow.style.cssText = 'padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)';
    summaryRow.innerHTML = currRows.map(([c,v]) => `
      <span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px">
        <span class="curr-badge curr-${c}">${c}</span>
        <span style="font-size:12px;color:var(--text-2)">${fmt(v,{currency:c})}</span>
      </span>
    `).join('');
    card.appendChild(summaryRow);
  }

  bankGroups.forEach(({ bank, accounts, totalTWD }) => {
    const groupId = 'bank_' + bank.id;
    const hasForeign = accounts.some(a => a.currency !== 'TWD');

    // Parent row
    const row = el('div', 'section-row');
    row.setAttribute('role', 'button');
    row.setAttribute('aria-expanded', 'false');
    row.dataset.target = groupId;
    row.innerHTML = `
      <div class="row-left">
        <span class="bank-dot" style="background:${bank.color ?? '#6B7280'}"></span>
        <div>
          <div class="row-label">${bank.name}</div>
          ${hasForeign ? `<div class="row-sub">${accounts.map(a =>
            a.currency !== 'TWD' ? `<span class="curr-badge curr-${a.currency}" style="margin-right:3px">${a.currency}</span>` : ''
          ).join('')}</div>` : ''}
        </div>
      </div>
      <div class="row-right">
        <div style="text-align:right">
          <div class="row-amount">NT$ ${fmt(totalTWD)}</div>
          ${accounts.length > 1 ? `<div class="row-sub">${accounts.length} 個帳戶</div>` : ''}
        </div>
        <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `;
    card.appendChild(row);

    // Sub-rows
    const sub = el('div', 'sub-rows');
    sub.id = groupId;
    accounts.forEach(acc => {
      const subRow = el('div', 'sub-row');
      subRow.style.cursor = 'pointer';
      subRow.title = '點擊更新餘額';
      const isForeign = acc.currency !== 'TWD';
      const updatedStr = acc.updated_at
        ? `<span style="font-size:10px;color:var(--text-3);margin-left:6px">${relativeTime(acc.updated_at)}</span>`
        : '';
      subRow.innerHTML = `
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
          <span class="sub-row-label">${acc.name}</span>
          ${updatedStr}
        </div>
        <div class="sub-row-right">
          ${isForeign ? `<span class="sub-row-original">${acc.currency} ${fmt(acc.balance,{currency:acc.currency})}</span>` : ''}
          <span class="sub-row-amount">${acc.currency === 'TWD' ? 'NT$' : '≈ NT$'} ${fmt(acc.balTWD)}</span>
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="var(--text-3)" stroke-width="2" style="flex-shrink:0;opacity:.6">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
      `;
      subRow.addEventListener('click', (e) => {
        e.stopPropagation();
        openBalanceModal(acc.id, acc.name, acc.currency, acc.balance);
      });
      sub.appendChild(subRow);
    });
    card.appendChild(sub);

    row.addEventListener('click', () => toggleSection(row, sub));
  });

  return card;
}

// ── Investment section ─────────────────────────────────────────────────────

function renderInvestmentSection({ byMarket, byBrokerage, totalTWD, hasMissingPrices, enriched }) {
  const card = el('div', 'card');
  const header = el('div', 'card-header');
  header.innerHTML = `
    <div class="card-title">
      <div class="icon-circle ic-navy">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      </div>
      投資資產
      ${hasMissingPrices ? '<span class="stale-badge" style="margin-left:6px">部分缺價格</span>' : ''}
    </div>
    <div class="card-total">NT$ ${fmt(totalTWD)}</div>
  `;
  card.appendChild(header);

  // Market groups: TW then US
  ['TW','US'].forEach(market => {
    const group = byMarket[market];
    if (!group) return;

    const groupId = 'inv_' + market;
    const label = market === 'TW' ? '台股' : '美股';

    const row = el('div', 'section-row');
    row.dataset.target = groupId;
    row.innerHTML = `
      <div class="row-left">
        <span class="curr-badge curr-${market === 'TW' ? 'TWD' : 'USD'}" style="font-size:11px">${label}</span>
        <span style="font-size:12px;color:var(--text-2)">${group.holdings.length} 支持倉</span>
      </div>
      <div class="row-right">
        <div class="row-amount">NT$ ${fmt(group.totalTWD)}</div>
        <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `;
    card.appendChild(row);

    const sub = el('div', 'sub-rows');
    sub.id = groupId;

    // Group by brokerage within this market
    const brokGroups = {};
    group.holdings.forEach(h => {
      const bid = h.brokerage_id;
      if (!brokGroups[bid]) brokGroups[bid] = { brokerage: h.brokerage, holdings: [] };
      brokGroups[bid].holdings.push(h);
    });

    Object.values(brokGroups).forEach(({ brokerage, holdings: bh }) => {
      // Brokerage sub-header
      const brokHeader = el('div', 'sub-row');
      brokHeader.style.cssText = 'background:var(--surface-2);font-size:11px;color:var(--text-3);font-weight:600;padding-left:18px;border-top:1px solid var(--border)';
      brokHeader.innerHTML = `<span>${brokerage?.name ?? '—'}</span>`;
      sub.appendChild(brokHeader);

      // Individual holdings
      bh.forEach(h => {
        const subRow = el('div', 'sub-row');
        const needsPrice = h.needsPriceUpdate || h.price == null;

        subRow.innerHTML = `
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:12px;font-weight:600;color:var(--text-1)">${h.ticker}</span>
              <span class="sub-row-label">${h.name}</span>
            </div>
            <div class="sub-row-original">${h.shares} 股</div>
          </div>
          <div class="sub-row-right">
            ${needsPrice
              ? `<button class="enter-price-btn" data-ticker="${h.ticker}" data-market="${h.market}" data-name="${h.name}">輸入價格</button>`
              : `<div style="text-align:right">
                  <div class="sub-row-amount">${h.currency} ${fmt(h.marketValueLocal,{currency:h.currency})}</div>
                  <div style="font-size:10px;color:var(--text-3)">@ ${h.price} ${h.priceFetchedAt ? '· ' + fmtDateTime(h.priceFetchedAt) : ''}</div>
                </div>`
            }
          </div>
        `;
        sub.appendChild(subRow);
      });
    });

    card.appendChild(sub);
    row.addEventListener('click', () => toggleSection(row, sub));
  });

  // Wire up price entry buttons
  card.querySelectorAll('.enter-price-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openPriceModal(btn.dataset.ticker, btn.dataset.market, btn.dataset.name);
    });
  });

  return card;
}

// ─── UI helpers ───────────────────────────────────────────────────────────────

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function toggleSection(row, sub) {
  const isOpen = sub.classList.contains('open');
  sub.classList.toggle('open', !isOpen);
  row.classList.toggle('expanded', !isOpen);
  row.setAttribute('aria-expanded', !isOpen);
}

function updateLastUpdated(fxRates) {
  const el = document.getElementById('lastUpdated');
  if (fxRates.usd_fetched_at) {
    el.textContent = '匯率 ' + relativeTime(fxRates.usd_fetched_at);
  } else {
    el.textContent = '匯率未取得';
  }
}

function relativeTime(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1)  return '剛剛';
  if (mins < 60) return `${mins} 分鐘前`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24)  return `${hrs} 小時前`;
  return fmtDate(iso);
}

// ─── Balance edit modal ───────────────────────────────────────────────────────

let _editAccId = null;

function openBalanceModal(accId, accName, currency, currentBalance) {
  _editAccId = accId;
  document.getElementById('balanceModalTitle').textContent = `更新餘額：${accName}`;
  document.getElementById('balanceModalLabel').textContent =
    `目前餘額（${currency}）`;
  document.getElementById('balanceModalInput').value = currentBalance;
  document.getElementById('balanceModal').classList.add('open');
  document.getElementById('balanceModalInput').focus();
  document.getElementById('balanceModalInput').select();
}

document.getElementById('balanceModalCancel').addEventListener('click', () => {
  document.getElementById('balanceModal').classList.remove('open');
});

document.getElementById('balanceModalSave').addEventListener('click', async () => {
  const raw = parseFloat(document.getElementById('balanceModalInput').value);
  if (isNaN(raw) || raw < 0) {
    document.getElementById('balanceModalInput').style.borderColor = 'var(--red)';
    return;
  }
  document.getElementById('balanceModal').classList.remove('open');

  // Load existing record, update balance + timestamp
  const acc = await getOne(db, 'accounts', _editAccId);
  if (acc) {
    await putOne(db, 'accounts', { ...acc, balance: raw, updated_at: new Date().toISOString() });
    await loadAndRender();
  }
});

document.getElementById('balanceModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

// ─── Price modal ──────────────────────────────────────────────────────────────

let _modalTicker = null, _modalMarket = null;

function openPriceModal(ticker, market, name) {
  _modalTicker = ticker;
  _modalMarket = market;
  document.getElementById('priceModalTitle').textContent = `輸入參考價格：${ticker}`;
  document.getElementById('priceModalLabel').textContent = `${name}（${market === 'TW' ? 'TWD' : 'USD'}）`;
  document.getElementById('priceModalInput').value = '';
  document.getElementById('priceModal').classList.add('open');
  document.getElementById('priceModalInput').focus();
}

document.getElementById('priceModalCancel').addEventListener('click', () => {
  document.getElementById('priceModal').classList.remove('open');
});

document.getElementById('priceModalSave').addEventListener('click', async () => {
  const price = parseFloat(document.getElementById('priceModalInput').value);
  if (isNaN(price) || price <= 0) {
    document.getElementById('priceModalInput').style.borderColor = 'var(--red)';
    return;
  }
  document.getElementById('priceModal').classList.remove('open');
  await setManualPrice(db, _modalTicker, _modalMarket, price);
  await loadAndRender();
});

// Close modal on overlay click
document.getElementById('priceModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

// ─── Import / Export ──────────────────────────────────────────────────────────

const BACKUP_STORES = ['banks','accounts','time_deposits','brokerages',
                       'holdings','market_prices','gold_holdings','receivables',
                       'fx_rates','settings'];

document.getElementById('refreshBtn').addEventListener('click', refreshMarketData);

document.getElementById('exportBtn').addEventListener('click', async () => {
  const backup = { version: 1, exported_at: new Date().toISOString(), data: {} };
  for (const s of BACKUP_STORES) backup.data[s] = await getAll(db, s);
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `pfcc-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ── Import ────────────────────────────────────────────────────────────────────

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').value = '';
  document.getElementById('importStatus').textContent = '';
  document.getElementById('importModalConfirm').disabled = true;
  document.getElementById('importModal').classList.add('open');
});

document.getElementById('importModalCancel').addEventListener('click', () => {
  document.getElementById('importModal').classList.remove('open');
});

document.getElementById('importModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

let _importData = null;

document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl  = document.getElementById('importStatus');
  const confirmBtn = document.getElementById('importModalConfirm');
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed?.version || !parsed?.data) throw new Error('不是有效的 PFCC 備份檔案');
    _importData = parsed;
    const counts = BACKUP_STORES.map(s =>
      `${s}: ${(parsed.data[s] ?? []).length} 筆`
    ).join('、');
    statusEl.style.color = 'var(--green)';
    statusEl.textContent = `✓ 備份日期 ${parsed.exported_at?.slice(0,10) ?? '未知'}`;
    confirmBtn.disabled = false;
  } catch (err) {
    _importData = null;
    statusEl.style.color = 'var(--red)';
    statusEl.textContent = `✗ ${err.message}`;
    confirmBtn.disabled = true;
  }
});

document.getElementById('importModalConfirm').addEventListener('click', async () => {
  if (!_importData) return;
  document.getElementById('importModal').classList.remove('open');

  // Write each store's records, replacing existing data
  for (const s of BACKUP_STORES) {
    const records = _importData.data[s] ?? [];
    if (records.length > 0) await putMany(db, s, records);
  }

  _importData = null;
  await loadAndRender();
});

const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');

function checkMobile() {
  const isMobile = window.innerWidth <= 768;
  menuBtn.style.display = isMobile ? 'flex' : 'none';
}
checkMobile();
window.addEventListener('resize', checkMobile);

menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
    sidebar.classList.remove('open');
  }
});
