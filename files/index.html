<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>PFCC — 個人財務控制台</title>
<script src="/register-sw.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1B2D;--navy-mid:#1A2E48;--navy-light:#243D5C;
  --blue:#2563EB;--blue-soft:#3B82F6;
  --surface:#F7F8FA;--surface-2:#EDEEF1;
  --border:#DDE0E7;--border-2:#C8CDD8;
  --text-1:#111827;--text-2:#4B5563;--text-3:#9CA3AF;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --sidebar-w:220px;--header-h:56px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang TC','Noto Sans TC',sans-serif;
  font-size:14px;color:var(--text-1);background:var(--surface);-webkit-font-smoothing:antialiased;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body{display:flex;min-height:100dvh}
.sidebar{width:var(--sidebar-w);min-height:100dvh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;transition:transform .25s ease}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--navy-light);display:flex;align-items:center;gap:10px}
.sidebar-logo-text{font-size:13px;font-weight:600;color:#E2E8F0;letter-spacing:.04em}
.sidebar-logo-sub{font-size:10px;color:#64748B;margin-top:1px}
.nav{padding:12px 0;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:500;color:#475569;letter-spacing:.08em;padding:16px 20px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:#94A3B8;cursor:pointer;border-left:2px solid transparent;transition:background .15s,color .15s;text-decoration:none}
.nav-item:hover{background:var(--navy-light);color:#CBD5E1}
.nav-item.active{color:#F1F5F9;background:var(--navy-mid);border-left-color:var(--blue-soft)}
.nav-item.disabled{opacity:.35;cursor:default;pointer-events:none}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.topbar-right{display:flex;align-items:center;gap:8px}
.content{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:1100px}

/* ── Collapsible card ── */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-header-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;transition:background .12s}
.card-header-row:hover{background:var(--surface)}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-total{font-size:14px;font-weight:600}
.card-body{display:none}
.card-body.open{display:block}
.chevron{width:15px;height:15px;color:var(--text-3);transition:transform .2s ease;flex-shrink:0}
.card-open .chevron{transform:rotate(90deg)}

/* ── Net Worth ── */
.networth-card{background:var(--navy);border-radius:12px;padding:28px 28px 24px;color:#fff}
.networth-label{font-size:12px;color:#94A3B8;font-weight:500;letter-spacing:.04em;margin-bottom:8px}
.networth-amount{font-size:40px;font-weight:300;letter-spacing:-1.5px;line-height:1;color:#F1F5F9}
.networth-currency{font-size:16px;font-weight:400;color:#64748B;margin-right:4px}
.networth-breakdown{display:flex;margin-top:24px;border-top:1px solid var(--navy-light);padding-top:20px}
.networth-item{flex:1;padding-right:20px}
.networth-item:not(:last-child){border-right:1px solid var(--navy-light);margin-right:20px}
.networth-item-label{font-size:11px;color:#64748B;margin-bottom:5px}
.networth-item-value{font-size:16px;font-weight:500;color:#E2E8F0}
.networth-item-sub{font-size:12px;color:#94A3B8;margin-top:4px;line-height:1.6}
.freshness-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 28px;background:var(--navy-mid);border-radius:0 0 12px 12px;margin-top:-1px;font-size:11px;color:#64748B}
.freshness-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fresh{background:#10B981}.stale{background:var(--amber)}

/* ── Bank / section rows ── */
.bank-row{display:flex;align-items:center;padding:12px 18px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s;user-select:none}
.bank-row:hover{background:var(--surface)}
.bank-row-left{display:flex;align-items:center;gap:10px;flex:1}
.bank-row-right{display:flex;align-items:center;gap:10px}
.bank-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Account rows (with aligned amounts) ── */
.acc-row{display:flex;align-items:center;padding:9px 18px 9px 44px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.acc-row:hover{background:var(--surface-2)}
.acc-row-name{flex:1;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.acc-row-updated{font-size:10px;color:var(--text-3)}
/* Fixed-width columns for aligned amounts */
.acc-row-amounts{display:flex;align-items:center;gap:0}
.acc-curr{font-size:10px;color:var(--text-3);text-align:right;min-width:26px;font-variant-numeric:tabular-nums;letter-spacing:0}
.acc-orig-num{font-size:10px;color:var(--text-3);text-align:right;min-width:68px;font-variant-numeric:tabular-nums;padding-right:2px}
.acc-sep{font-size:10px;color:var(--text-3);width:10px;text-align:center}
.acc-twd-label{font-size:10px;color:var(--text-2);width:18px;text-align:right}
.acc-twd{font-size:12px;font-weight:500;color:var(--text-1);text-align:right;min-width:68px;font-variant-numeric:tabular-nums;padding-left:2px}
.acc-edit-icon{margin-left:6px;opacity:.4;flex-shrink:0}

/* ── Drag handle for sortable ── */
.drag-handle{cursor:grab;color:var(--text-3);padding:0 4px;touch-action:none}
.drag-handle:active{cursor:grabbing}
.drag-over{background:var(--surface-2)!important;border-top:2px solid var(--blue)!important}

/* ── Badges ── */
.curr-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.03em;flex-shrink:0}
.curr-TWD{background:#DCFCE7;color:#166534}
.curr-USD{background:#DBEAFE;color:#1E40AF}
.curr-JPY{background:#FEF9C3;color:#854D0E}
.icon-circle{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-blue{background:#EFF6FF;color:var(--blue)}
.ic-green{background:var(--green-bg);color:var(--green)}
.ic-amber{background:var(--amber-bg);color:var(--amber)}
.ic-navy{background:var(--navy-light);color:#93C5FD}

/* ── Receivables ── */
.recv-card{border:1px solid #FDE68A;background:var(--amber-bg);border-radius:10px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px}
.recv-card-title{font-size:13px;font-weight:600;color:#92400E;margin-bottom:4px}
.recv-card-desc{font-size:12px;color:#B45309}

/* ── Badges ── */
.stale-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--amber-bg);color:var(--amber)}
.enter-price-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border-2);background:#fff;cursor:pointer;color:var(--text-2)}
.enter-price-btn:hover{background:var(--surface-2)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1D4ED8}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-icon{padding:7px}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:min(480px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90dvh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{font-size:12px;color:var(--text-2);display:block;margin-bottom:5px;font-weight:500}
.modal-field input,.modal-field select{width:100%;padding:9px 12px;border:1px solid var(--border-2);border-radius:7px;font-size:14px;outline:none;transition:border-color .15s;background:#fff}
.modal-field input:focus,.modal-field select:focus{border-color:var(--blue)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Settings ── */
.settings-section{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.settings-section-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.settings-section-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row:hover{background:var(--surface)}
.settings-row-left{flex:1}
.settings-row-name{font-size:13px;font-weight:500;color:var(--text-1)}
.settings-row-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.settings-row-actions{display:flex;align-items:center;gap:8px}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.empty-state{padding:32px 18px;text-align:center;color:var(--text-3)}
.empty-state p{font-size:13px}

/* ── Transfer ── */
.transfer-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;max-width:540px}
.transfer-arrow{display:flex;align-items:center;justify-content:center;padding:6px 0;color:var(--text-3)}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ── Skeleton ── */
.skeleton{background:linear-gradient(90deg,#E5E7EB 25%,#F3F4F6 50%,#E5E7EB 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px;display:inline-block}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Responsive ── */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  .sidebar{transform:translateX(-220px);width:220px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:16px}
  .networth-breakdown{flex-direction:column;gap:12px}
  .networth-item:not(:last-child){border-right:none;padding-right:0;margin-right:0;border-bottom:1px solid var(--navy-light);padding-bottom:12px}
  .networth-amount{font-size:30px}
  .field-row{grid-template-columns:1fr}
  .acc-orig-num{min-width:56px}
  .acc-twd{min-width:56px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="7" fill="#2563EB" opacity=".15"/>
      <path d="M7 14h14M14 7v14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="3" fill="#3B82F6"/>
    </svg>
    <div>
      <div class="sidebar-logo-text">PFCC</div>
      <div class="sidebar-logo-sub">個人財務控制台</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-section">總覽</div>
    <a class="nav-item" href="#" data-view="assets">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      資產總覽
    </a>
    <div class="nav-section">記帳</div>
    <a class="nav-item disabled">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      新增記帳
    </a>
    <div class="nav-section">管理</div>
    <a class="nav-item" href="#" data-view="settings">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      帳戶設定
    </a>
    <a class="nav-item" href="#" data-view="transfer">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
      帳戶移轉
    </a>
    <a class="nav-item" href="#" data-view="holdings">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      投資持倉
    </a>
  </div>
</nav>

<!-- ── Main ── -->
<div class="main">
  <header class="topbar">
    <button class="btn btn-ghost btn-icon" id="menuBtn" aria-label="選單" style="display:none">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title" id="topbarTitle">資產總覽</span>
    <div class="topbar-right">
      <span class="updated-at" id="lastUpdated"></span>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="更新報價與匯率">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4 9a8 8 0 0115 3M20 15a8 8 0 01-15-3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯出備份" id="exportBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯入備份" id="importBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </button>
    </div>
  </header>
  <div class="content" id="content">
    <div style="padding:40px 0;text-align:center">
      <div class="skeleton" style="width:200px;height:20px;margin:0 auto 12px"></div>
      <div class="skeleton" style="width:140px;height:14px;margin:0 auto"></div>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── Balance modal ── -->
<div class="modal-overlay" id="balanceModal">
  <div class="modal">
    <h2 id="balanceModalTitle">更新餘額</h2>
    <div class="modal-field">
      <label id="balanceModalLabel">目前餘額</label>
      <input type="number" id="balanceModalInput" placeholder="輸入最新餘額" min="0" step="0.01">
    </div>
    <div style="font-size:11px;color:var(--text-3)">更新後記錄最後確認時間，不影響交易紀錄。</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="balanceModalCancel">取消</button>
      <button class="btn btn-primary" id="balanceModalSave">確認更新</button>
    </div>
  </div>
</div>

<!-- ── Bank modal ── -->
<div class="modal-overlay" id="bankModal">
  <div class="modal">
    <h2 id="bankModalTitle">新增銀行</h2>
    <div class="modal-field">
      <label>銀行名稱</label>
      <input type="text" id="bankName" placeholder="例：中國信託">
    </div>
    <div class="modal-field">
      <label>顏色標記</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="bankColorPicker"></div>
    </div>
    <input type="hidden" id="bankEditId">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bankModalCancel">取消</button>
      <button class="btn btn-primary" id="bankModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Account modal ── -->
<div class="modal-overlay" id="accountModal">
  <div class="modal">
    <h2 id="accountModalTitle">新增帳戶</h2>
    <div class="modal-field">
      <label>所屬銀行</label>
      <select id="accountBankId"><option value="">── 現金（不屬於任何銀行）──</option></select>
    </div>
    <div class="modal-field">
      <label>帳戶名稱</label>
      <input type="text" id="accountName" placeholder="例：台幣活存">
    </div>
    <div class="field-row">
      <div class="modal-field">
        <label>帳戶類型</label>
        <select id="accountType">
          <option value="checking">活存 / 帳戶</option>
          <option value="savings">儲蓄存款</option>
          <option value="foreign">外幣帳戶</option>
          <option value="cash">現金</option>
        </select>
      </div>
      <div class="modal-field">
        <label>幣別</label>
        <select id="accountCurrency">
          <option value="TWD">TWD 台幣</option>
          <option value="USD">USD 美元</option>
          <option value="JPY">JPY 日圓</option>
        </select>
      </div>
    </div>
    <div class="modal-field">
      <label>目前餘額</label>
      <input type="number" id="accountBalance" placeholder="0" min="0" step="0.01">
    </div>
    <input type="hidden" id="accountEditId">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="accountModalCancel">取消</button>
      <button class="btn btn-primary" id="accountModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Delete confirm modal ── -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2 id="deleteModalTitle">確認刪除</h2>
    <p id="deleteModalMsg" style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:4px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteModalCancel">取消</button>
      <button class="btn btn-danger" id="deleteModalConfirm">確認刪除</button>
    </div>
  </div>
</div>

<!-- ── Price modal ── -->
<div class="modal-overlay" id="priceModal">
  <div class="modal">
    <h2 id="priceModalTitle">輸入參考價格</h2>
    <div class="modal-field">
      <label id="priceModalLabel">股票代號</label>
      <input type="number" id="priceModalInput" placeholder="輸入目前參考價格" min="0" step="0.01">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="priceModalCancel">取消</button>
      <button class="btn btn-primary" id="priceModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Brokerage modal ── -->
<div class="modal-overlay" id="brokerageModal">
  <div class="modal">
    <h2 id="brokerageModalTitle">新增券商</h2>
    <div class="modal-field">
      <label>券商名稱</label>
      <input type="text" id="brokerageName" placeholder="例：台新證券">
    </div>
    <div class="field-row">
      <div class="modal-field">
        <label>交易市場</label>
        <select id="brokerageMarket">
          <option value="TW">台股（TWD）</option>
          <option value="US">美股（USD）</option>
        </select>
      </div>
      <div class="modal-field">
        <label>所屬銀行（選填）</label>
        <select id="brokerageBankId">
          <option value="">── 不指定 ──</option>
        </select>
      </div>
    </div>

<script type="module">
import { openDB, seedIfNeeded, getAll, getOne, putOne, putMany, getSetting, setSetting } from './db.js';
import { refreshPrices, refreshFxRates, getFxRates, setManualPrice } from './market.js';
import {
  calcCashAssets, calcDepositAssets, calcInvestmentAssets,
  calcReceivables, calcNetWorth,
  fmt, fmtDate, fmtDateTime, daysUntil, toTWD,
} from './calc.js';

let db, state = {}, currentView = 'assets';

// ── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
  db = await openDB();
  await seedIfNeeded(db);
  setupNav();
  await navigate('assets');
  refreshMarketData().catch(e => console.warn('[init]', e));
}

function setupNav() {
  document.querySelectorAll('.nav-item[data-view]').forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      navigate(item.dataset.view);
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

async function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-item[data-view]').forEach(i =>
    i.classList.toggle('active', i.dataset.view === view));
  const titles = { assets:'資產總覽', settings:'帳戶設定', transfer:'帳戶移轉', holdings:'投資持倉設定' };
  document.getElementById('topbarTitle').textContent = titles[view] ?? view;
  document.getElementById('refreshBtn').style.display = view === 'assets' ? '' : 'none';
  if (view === 'assets')        await renderAssets();
  else if (view === 'settings') await renderSettings();
  else if (view === 'transfer') await renderTransfer();
  else if (view === 'holdings') await renderHoldings();
}

async function loadData() {
  const [banks, accounts, deposits, brokerages, holdings, goldHoldings, receivables, prices] =
    await Promise.all([
      getAll(db,'banks'), getAll(db,'accounts'), getAll(db,'time_deposits'),
      getAll(db,'brokerages'), getAll(db,'holdings'), getAll(db,'gold_holdings'),
      getAll(db,'receivables'), getAll(db,'market_prices'),
    ]);
  const fxRates = await getFxRates(db);
  const cash       = calcCashAssets(accounts, banks, fxRates);
  const depositRes = calcDepositAssets(deposits, banks, fxRates);
  const inv        = calcInvestmentAssets(holdings, brokerages, prices, fxRates);
  const recv       = calcReceivables(receivables);
  const netWorth   = calcNetWorth({ cashTWD:cash.totalTWD, depositTWD:depositRes.totalTWD, investmentTWD:inv.totalTWD });
  state = { banks, accounts, deposits, brokerages, holdings, prices, goldHoldings, receivables, fxRates, cash, depositRes, inv, recv, netWorth };
}

async function refreshMarketData() {
  const holdings = state?.holdings ?? [];
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.style.opacity='.4'; btn.style.pointerEvents='none'; }
  await Promise.allSettled([
    refreshFxRates(db).catch(e=>console.warn('[FX]',e)),
    refreshPrices(db,holdings).catch(e=>console.warn('[prices]',e)),
  ]);
  if (btn) { btn.style.opacity=''; btn.style.pointerEvents=''; }
  if (currentView==='assets') await renderAssets();
}

// ════════════════════════════════════════════════════════════════════════════
// ASSETS VIEW
// ════════════════════════════════════════════════════════════════════════════
async function renderAssets() {
  await loadData();
  const { netWorth, cash, depositRes, inv, recv, fxRates } = state;
  const content = document.getElementById('content');
  content.innerHTML = '';

  // Net worth hero
  const wrap = el('div');
  const nw = el('div','networth-card');
  nw.innerHTML = `
    <div class="networth-label">總資產（折合台幣）</div>
    <div class="networth-amount"><span class="networth-currency">NT$</span>${fmt(netWorth)}</div>
    <div class="networth-breakdown">
      <div class="networth-item">
        <div class="networth-item-label">現金 &amp; 存款</div>
        <div class="networth-item-value">NT$ ${fmt(cash.totalTWD)}</div>
        <div class="networth-item-sub" style="font-variant-numeric:tabular-nums;line-height:1.7">
          ${Object.entries(cash.byCurrency).filter(([,v])=>v>0).map(([c,v])=>`<span style="display:inline-block;min-width:30px;font-weight:500">${c}</span> <span>${fmt(v,{currency:c})}</span>`).join('<br>')}
        </div>
      </div>
      <div class="networth-item">
        <div class="networth-item-label">定存</div>
        <div class="networth-item-value">NT$ ${fmt(depositRes.totalTWD)}</div>
      </div>
      <div class="networth-item">
        <div class="networth-item-label">投資資產</div>
        <div class="networth-item-value">NT$ ${fmt(inv.totalTWD)}</div>
      </div>
      ${recv.pending.length>0?`
      <div class="networth-item">
        <div class="networth-item-label" style="color:#B45309">應收款（不計入）</div>
        <div class="networth-item-value" style="color:#FCD34D">NT$ ${fmt(recv.totalTWD)}</div>
      </div>`:''}
    </div>`;
  wrap.appendChild(nw);
  const bar = el('div','freshness-bar');
  const usdAge = fxRates.usd_fetched_at ? relativeTime(fxRates.usd_fetched_at) : '未取得';
  const usdAbsTime = fxRates.usd_fetched_at ? fmtShortTime(fxRates.usd_fetched_at) : '';
  bar.innerHTML = `
    <span class="freshness-dot ${fxRates.is_stale?'stale':'fresh'}"></span>
    <span>匯率更新：${usdAge}${usdAbsTime?' '+usdAbsTime:''}</span>
    <span style="color:#334155;margin:0 4px">·</span>
    <span style="color:#475569">US$1 ≈ NT$${fxRates.USD_TWD}</span>
    <span style="color:#334155;margin:0 4px">·</span>
    <span style="color:#475569">¥100 ≈ NT$${(fxRates.JPY_TWD*100).toFixed(2)}</span>
    ${fxRates.is_stale?'<span class="stale-badge" style="margin-left:4px">匯率可能過時</span>':''}`;
  wrap.appendChild(bar);
  content.appendChild(wrap);

  // 1. Cash (collapsible)
  content.appendChild(buildCollapsibleSection({
    icon: `<div class="icon-circle ic-green"><svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg></div>`,
    label: '現金',
    total: cash.byBank['__cash__']?.totalTWD ?? 0,
    buildBody: () => {
      const frag = document.createDocumentFragment();
      const cashGroup = cash.byBank['__cash__'];
      if (!cashGroup || cashGroup.accounts.length === 0) {
        const e = el('div'); e.style.cssText='padding:20px 18px;text-align:center;color:var(--text-3);font-size:13px';
        e.textContent = '尚無現金帳戶，前往「帳戶設定」新增。';
        frag.appendChild(e); return frag;
      }
      cashGroup.accounts.forEach(acc => {
        const row = buildAccRow(acc, false);
        frag.appendChild(row);
      });
      return frag;
    }
  }));

  // 2. Bank accounts (collapsible, banks inside are also collapsible)
  const bankGroups = Object.values(cash.byBank).filter(g=>g.bank.id!=='__cash__').sort((a,b)=>(a.bank.sort_order??99)-(b.bank.sort_order??99));
  const bankTWD = bankGroups.reduce((s,g)=>s+g.totalTWD, 0);
  content.appendChild(buildCollapsibleSection({
    icon: `<div class="icon-circle ic-blue"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>`,
    label: '銀行帳戶',
    total: bankTWD,
    buildBody: () => {
      const frag = document.createDocumentFragment();
      if (bankGroups.length === 0) {
        const e = el('div'); e.style.cssText='padding:20px 18px;text-align:center;color:var(--text-3);font-size:13px';
        e.textContent = '尚無銀行帳戶，前往「帳戶設定」新增。';
        frag.appendChild(e); return frag;
      }
      bankGroups.forEach(({ bank, accounts, totalTWD }) => {
        const hasForeign = accounts.some(a=>a.currency!=='TWD');
        const bankRow = el('div','bank-row');
        bankRow.innerHTML = `
          <div class="bank-row-left">
            <span class="bank-dot" style="background:${bank.color??'#6B7280'}"></span>
            <div>
              <div style="font-size:13px;font-weight:500">${bank.name}</div>
              ${hasForeign?`<div style="display:flex;gap:3px;margin-top:2px">${accounts.map(a=>a.currency!=='TWD'?`<span class="curr-badge curr-${a.currency}">${a.currency}</span>`:'').join('')}</div>`:''}
            </div>
          </div>
          <div class="bank-row-right">
            <div style="text-align:right">
              <div style="font-size:13px;font-weight:600">NT$ ${fmt(totalTWD)}</div>
              ${accounts.length>1?`<div style="font-size:11px;color:var(--text-3)">${accounts.length} 個帳戶</div>`:''}
            </div>
            <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>`;

        const accContainer = el('div'); accContainer.style.display='none';
        // Sortable accounts
        const sortedAccs = [...accounts].sort((a,b)=>(a.sort_order??999)-(b.sort_order??999));
        sortedAccs.forEach(acc => {
          const row = buildAccRow(acc, true);
          row.draggable = true;
          row.dataset.accId = acc.id;
          row.dataset.bankId = bank.id;
          setupDragSort(row, accContainer, 'acc', bank.id);
          accContainer.appendChild(row);
        });

        bankRow.addEventListener('click', () => {
          const isOpen = accContainer.style.display !== 'none';
          accContainer.style.display = isOpen ? 'none' : 'block';
          bankRow.classList.toggle('card-open', !isOpen);
        });

        frag.appendChild(bankRow);
        frag.appendChild(accContainer);
      });
      return frag;
    }
  }));

  // 3. Deposits (collapsible)
  if (depositRes.items.length > 0) {
    content.appendChild(buildCollapsibleSection({
      icon: `<div class="icon-circle ic-amber"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></div>`,
      label: '定存',
      total: depositRes.totalTWD,
      buildBody: () => {
        const frag = document.createDocumentFragment();
        depositRes.items.forEach(dep => {
          const days = daysUntil(dep.maturity_date);
          const urgency = days!=null&&days<=30?'color:var(--amber)':'color:var(--text-3)';
          const row = el('div');
          row.style.cssText = 'padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between';
          row.innerHTML = `
            <div>
              <div style="font-size:13px;font-weight:500">${dep.bank?.name??''} ${dep.label}</div>
              <div style="font-size:11px;color:var(--text-3);margin-top:2px">到期：${fmtDate(dep.maturity_date)} ${days!=null?`<span style="${urgency}">（${days===0?'今天':days+' 天後'}）</span>`:''}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:13px;font-weight:600">${dep.currency} ${fmt(dep.principal,{currency:dep.currency})}</div>
              <div style="font-size:11px;color:var(--text-3)">≈ NT$ ${fmt(dep.principalTWD)}</div>
            </div>`;
          frag.appendChild(row);
        });
        return frag;
      }
    }));
  }

  // 4. Investments (collapsible)
  content.appendChild(buildCollapsibleSection({
    icon: `<div class="icon-circle ic-navy"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>`,
    label: inv.hasMissingPrices ? '投資資產 <span class="stale-badge" style="margin-left:4px">部分缺價格</span>' : '投資資產',
    total: inv.totalTWD,
    buildBody: () => {
      const frag = document.createDocumentFragment();
      ['TW','US'].forEach(market => {
        const group = inv.byMarket[market]; if (!group) return;
        const label = market==='TW'?'台股':'美股';
        const mRow = el('div','bank-row');
        mRow.innerHTML = `
          <div class="bank-row-left">
            <span class="curr-badge curr-${market==='TW'?'TWD':'USD'}" style="font-size:11px">${label}</span>
            <span style="font-size:12px;color:var(--text-2)">${group.holdings.length} 支持倉</span>
          </div>
          <div class="bank-row-right">
            <div style="font-size:13px;font-weight:600">NT$ ${fmt(group.totalTWD)}</div>
            <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>`;
        const holdContainer = el('div'); holdContainer.style.display='none';

        // Group by brokerage
        const brokGroups = {};
        group.holdings.forEach(h => {
          if (!brokGroups[h.brokerage_id]) brokGroups[h.brokerage_id]={brokerage:h.brokerage,holdings:[]};
          brokGroups[h.brokerage_id].holdings.push(h);
        });
        Object.values(brokGroups).forEach(({ brokerage, holdings: bh }) => {
          const bHead = el('div');
          bHead.style.cssText='background:var(--surface-2);font-size:11px;color:var(--text-3);font-weight:600;padding:7px 18px 7px 36px;border-top:1px solid var(--border)';
          bHead.textContent = brokerage?.name ?? '—';
          holdContainer.appendChild(bHead);
          bh.forEach(h => {
            const needsPrice = h.needsPriceUpdate || h.price==null;
            const hr = el('div');
            hr.style.cssText='display:flex;align-items:center;padding:9px 18px 9px 36px;border-top:1px solid var(--border);font-size:12px';
            hr.innerHTML = `
              <div style="flex:1">
                <span style="font-weight:600;margin-right:6px">${h.ticker}</span>
                <span style="color:var(--text-2)">${h.name}</span>
                <div style="font-size:10px;color:var(--text-3);margin-top:2px">${h.shares} 股</div>
              </div>
              <div style="text-align:right">
                ${needsPrice
                  ? `<button class="enter-price-btn" data-ticker="${h.ticker}" data-market="${h.market}" data-name="${h.name}">輸入價格</button>`
                  : `<div style="font-weight:500">${h.currency} ${fmt(h.marketValueLocal,{currency:h.currency})}</div>
                     <div style="font-size:10px;color:var(--text-3)">@ ${h.price}${h.priceFetchedAt?' · '+fmtDateTime(h.priceFetchedAt):''}</div>`}
              </div>`;
            holdContainer.appendChild(hr);
          });
        });

        holdContainer.querySelectorAll('.enter-price-btn').forEach(btn => {
          btn.addEventListener('click', e => { e.stopPropagation(); openPriceModal(btn.dataset.ticker,btn.dataset.market,btn.dataset.name); });
        });

        mRow.addEventListener('click', () => {
          const isOpen = holdContainer.style.display !== 'none';
          holdContainer.style.display = isOpen ? 'none' : 'block';
          mRow.classList.toggle('card-open', !isOpen);
        });
        frag.appendChild(mRow);
        frag.appendChild(holdContainer);
      });
      return frag;
    }
  }));

  updateLastUpdated(fxRates);

  // 5. Receivables (collapsible, after investments, not counted in total)
  content.appendChild(buildCollapsibleSection({
    icon: `<div class="icon-circle ic-amber"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 9v3m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>`,
    label: '應收款 <span style="font-size:11px;font-weight:400;color:var(--text-3);margin-left:4px">不計入總資產</span>',
    total: recv.totalTWD,
    buildBody: () => {
      const frag = document.createDocumentFragment();
      if (recv.pending.length === 0) {
        const e = el('div'); e.style.cssText='padding:20px 18px;text-align:center;color:var(--text-3);font-size:13px';
        e.textContent='尚無應收款，前往「帳戶設定」新增。';
        frag.appendChild(e); return frag;
      }
      recv.pending.forEach(r => {
        const pending = r.total_amount - r.received_amount;
        const row = el('div');
        row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--border);font-size:13px';
        row.innerHTML = `
          <div>
            <div style="font-weight:500">${r.name}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:600;color:var(--amber)">NT$ ${fmt(pending)}</div>
            ${r.received_amount>0?`<div style="font-size:11px;color:var(--text-3)">已收 NT$ ${fmt(r.received_amount)}</div>`:''}
          </div>`;
        frag.appendChild(row);
      });
      return frag;
    }
  }));
}

// ── Collapsible card builder ──────────────────────────────────────────────────
function buildCollapsibleSection({ icon, label, total, buildBody }) {
  const card = el('div','card');
  const header = el('div','card-header-row');
  header.setAttribute('role','button');
  header.innerHTML = `
    <div class="card-title">${icon}<span>${label}</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="card-total">NT$ ${fmt(total)}</div>
      <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>`;
  card.appendChild(header);

  const body = el('div','card-body');
  body.appendChild(buildBody());
  card.appendChild(body);

  header.addEventListener('click', () => {
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    header.classList.toggle('card-open', !isOpen);
  });

  return card;
}

// ── Account row with aligned amounts ─────────────────────────────────────────

    </div>`;

  // Click anywhere except drag handle opens balance modal
  row.addEventListener('click', e => {
    if (e.target.closest('.drag-handle')) return;
    openBalanceModal(acc.id, acc.name, acc.currency, acc.balance);
  });
  return row;
}

// ── Drag-and-drop sort ────────────────────────────────────────────────────────
function setupDragSort(row, container, type, bankId) {
  row.addEventListener('dragstart', e => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.accId);
    row.style.opacity = '.4';
  });
  row.addEventListener('dragend', () => { row.style.opacity=''; });
  row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', async e => {
    e.preventDefault();
    row.classList.remove('drag-over');
    const draggedId = e.dataTransfer.getData('text/plain');
    if (draggedId === row.dataset.accId) return;

    // Reorder DOM
    const rows = [...container.querySelectorAll('.acc-row')];
    const draggedEl = rows.find(r => r.dataset.accId === draggedId);
    if (!draggedEl) return;
    container.insertBefore(draggedEl, row);

    // Persist new sort_order
    const newOrder = [...container.querySelectorAll('.acc-row')].map(r => r.dataset.accId);
    for (let i = 0; i < newOrder.length; i++) {
      const acc = await getOne(db, 'accounts', newOrder[i]);
      if (acc) await putOne(db, 'accounts', { ...acc, sort_order: i });
    }
  });
}

    const fromOpt = fromSel.options[fromSel.selectedIndex];

    document.getElementById('transferRateLabel').textContent = `匯率（1 ${fromCurr} = ? ${toCurr}）`;

    if (isSame) {
      noteEl.style.color='var(--red)'; noteEl.textContent='來源與目標帳戶不能相同';
    } else if (isCross) {
      const refRate = getRefRate(fromCurr, toCurr, fxRates);
      document.getElementById('transferRateHint').textContent =
        refRate ? `參考匯率：1 ${fromCurr} ≈ ${refRate} ${toCurr}（來自系統匯率，請以實際換匯為準）` : '';
      noteEl.textContent='';
    } else {
      noteEl.style.color='var(--text-3)';
      noteEl.textContent=`來源餘額：${fromCurr} ${fmt(parseFloat(fromOpt.dataset.balance),{currency:fromCurr})}`;
    }
  }

  // Auto-calc rate; allow manual override
  function autoCalcRate() {
    const fromAmt = parseFloat(document.getElementById('transferAmount').value);
    const toAmt   = parseFloat(document.getElementById('transferToAmount')?.value);
    if (fromAmt>0 && toAmt>0) {
      const rateInput = document.getElementById('transferRate');
      if (!rateInput.dataset.manualOverride) {
        rateInput.value = (toAmt/fromAmt).toFixed(6);
      }
    }
  }

  document.getElementById('transferRate')?.addEventListener('focus', function() {
    this.dataset.manualOverride='1';
  });

  fromSel.addEventListener('change', updateForm);
  toSel.addEventListener('change', updateForm);
  document.getElementById('transferAmount').addEventListener('input', autoCalcRate);
  document.getElementById('transferToAmount')?.addEventListener('input', autoCalcRate);

  document.getElementById('transferConfirm').addEventListener('click', async () => {
    const fromId  = fromSel.value;
    const toId    = toSel.value;
    const fromAmt = parseFloat(document.getElementById('transferAmount').value);
    const fee     = parseFloat(document.getElementById('transferFee')?.value) || 0;
    const fromOpt = fromSel.options[fromSel.selectedIndex];
    const toOpt   = toSel.options[toSel.selectedIndex];
    const isCross = fromOpt.dataset.currency !== toOpt.dataset.currency;

    if (fromId===toId) { showToast('來源與目標帳戶不能相同'); return; }
    if (!fromAmt||fromAmt<=0) { showToast('請輸入有效的轉出金額'); return; }

    const fromAcc = await getOne(db,'accounts',fromId);
    const toAcc   = await getOne(db,'accounts',toId);
    if (!fromAcc||!toAcc) return;

    let toAmt = fromAmt;
    let rate  = null;

    if (isCross) {
      toAmt = parseFloat(document.getElementById('transferToAmount')?.value);
      rate  = parseFloat(document.getElementById('transferRate')?.value);
      if (!toAmt||toAmt<=0) { showToast('請輸入轉入金額'); return; }
      if (!rate||rate<=0) { showToast('請輸入匯率'); return; }
    }

    // Deduct from source (amount + fee)
    await putOne(db,'accounts',{ ...fromAcc, balance:+(fromAcc.balance-fromAmt-fee).toFixed(6), updated_at:new Date().toISOString() });
    // Add to target
    await putOne(db,'accounts',{ ...toAcc, balance:+(toAcc.balance+toAmt).toFixed(6), updated_at:new Date().toISOString() });

    // Log
    try {
      await putOne(db,'transfer_logs',{
        id:crypto.randomUUID(), created_at:new Date().toISOString(),
        from_account_id:fromId, from_account_name:fromAcc.name,
        from_currency:fromAcc.currency, from_amount:fromAmt,
        to_account_id:toId, to_account_name:toAcc.name,
        to_currency:toAcc.currency, to_amount:toAmt,
        fx_rate:rate, fee:fee||null,
      });
    } catch(e) { console.warn('transfer_logs',e); }

    const summary = isCross
      ? `✓ 轉出 ${fromAmt} ${fromAcc.currency}，轉入 ${toAmt} ${toAcc.currency}（匯率 ${rate}）`
      : `✓ 已移轉 ${fromAmt} ${fromAcc.currency}${fee?`，手續費 ${fee}`:''}`;
    showToast(summary);
    await renderTransfer();
  });

  // Receivable settlement panel
  const recvItems = (state.receivables ?? []).filter(r=>!r.is_settled);
  if (recvItems.length > 0) {
    const recvPanel = el('div','transfer-panel'); recvPanel.style.marginTop='16px';
    recvPanel.innerHTML = `
      <h3 style="font-size:15px;font-weight:600;margin-bottom:4px">應收款入帳</h3>
      <p style="font-size:12px;color:var(--text-3);margin-bottom:16px">對方還款後，記錄款項轉入哪個帳戶。不計手續費。</p>
      <div class="modal-field">
        <label>應收款項目</label>
        <select id="recvSelect">
          <option value="">── 請選擇 ──</option>
          ${recvItems.map(r=>`<option value="${r.id}" data-total="${r.total_amount}" data-received="${r.received_amount}">${r.name}（待收 NT$ ${fmt(r.total_amount-r.received_amount)}）</option>`).join('')}
        </select>
      </div>
      <div id="recvFormBody" style="display:none">
        <div class="modal-field">
          <label>轉入帳戶</label>
          <select id="recvToAcc">
            <option value="">── 請選擇帳戶 ──</option>
            ${accounts.map(a=>{const bank=bankMap[a.bank_id];return`<option value="${a.id}" data-currency="${a.currency}">${bank?bank.name+' · ':''}${a.name} (${a.currency})</option>`;}).join('')}
          </select>
        </div>
        <div class="modal-field">
          <label>收到金額（TWD）</label>
          <input type="number" id="recvAmount" placeholder="0" min="0.01" step="0.01">
        </div>
        <div id="recvNote" style="font-size:12px;color:var(--text-3);margin-bottom:12px"></div>
        <button class="btn btn-primary" id="recvConfirm" style="width:100%;justify-content:center">確認入帳</button>
      </div>`;
    content.appendChild(recvPanel);

    document.getElementById('recvSelect').addEventListener('change', function() {
      const body = document.getElementById('recvFormBody');
      const opt = this.options[this.selectedIndex];
      body.style.display = this.value ? 'block' : 'none';
      if (this.value) {
        const pending = opt.dataset.total - opt.dataset.received;
        document.getElementById('recvNote').textContent = `待收金額：NT$ ${fmt(pending)}`;
        document.getElementById('recvAmount').value = pending;
      }
    });

    document.getElementById('recvConfirm')?.addEventListener('click', async () => {
      const recvId = document.getElementById('recvSelect').value;
      const toAccId = document.getElementById('recvToAcc').value;
      const amount = parseFloat(document.getElementById('recvAmount').value);
      if (!recvId) { showToast('請選擇應收款項目'); return; }
      if (!toAccId) { showToast('請選擇轉入帳戶'); return; }
      if (!amount || amount <= 0) { showToast('請輸入收到金額'); return; }

      const recvItem = await getOne(db,'receivables',recvId);
      const toAcc = await getOne(db,'accounts',toAccId);
      if (!recvItem||!toAcc) return;

      const newReceived = recvItem.received_amount + amount;
      const isFullySettled = newReceived >= recvItem.total_amount;
      await putOne(db,'receivables',{
        ...recvItem, received_amount: newReceived,
        is_settled: isFullySettled,
      });
      await putOne(db,'accounts',{
        ...toAcc, balance: +(toAcc.balance+amount).toFixed(6),
        updated_at: new Date().toISOString(),
      });

      showToast(`✓ NT$ ${fmt(amount)} 已入帳至「${toAcc.name}」${isFullySettled?'，應收款已全數結清':''}`);
      await renderTransfer();
    });
  }
  try {
    const logs = await getAll(db,'transfer_logs');
    if (logs&&logs.length>0) {
      const hist = el('div','transfer-panel'); hist.style.marginTop='16px';
      hist.innerHTML=`<h3 style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text-2)">移轉記錄（最近 20 筆）</h3>`;
      logs.sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,20).forEach(log => {
        const r=el('div');
        r.style.cssText='padding:10px 0;border-bottom:1px solid var(--border);font-size:12px';
        r.innerHTML=`
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <span style="font-weight:500">${log.from_account_name}</span>
              <span style="color:var(--text-3);margin:0 6px">→</span>
              <span style="font-weight:500">${log.to_account_name}</span>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px">
              <div>${log.from_amount} ${log.from_currency}</div>
              ${log.fx_rate?`<div style="color:var(--text-3)">= ${log.to_amount} ${log.to_currency}</div>`:''}
            </div>
          </div>
          <div style="color:var(--text-3);margin-top:3px;display:flex;gap:12px">
            <span>${fmtDateTime(log.created_at)}</span>
            ${log.fx_rate?`<span>匯率 ${log.fx_rate}</span>`:''}
            ${log.fee?`<span>手續費 ${log.fee}</span>`:''}
          </div>`;
        hist.appendChild(r);
      });
      content.appendChild(hist);
    }
  } catch(e) {}
}

function getRefRate(fromCurr, toCurr, fxRates) {
  const r = fxRates;
  if (fromCurr==='USD'&&toCurr==='TWD') return r.USD_TWD?.toFixed(4);
  if (fromCurr==='JPY'&&toCurr==='TWD') return r.JPY_TWD?.toFixed(6);
  if (fromCurr==='TWD'&&toCurr==='USD') return (1/r.USD_TWD)?.toFixed(6);
  if (fromCurr==='TWD'&&toCurr==='JPY') return (1/r.JPY_TWD)?.toFixed(4);
  if (fromCurr==='USD'&&toCurr==='JPY') return (r.USD_TWD/r.JPY_TWD)?.toFixed(4);
  if (fromCurr==='JPY'&&toCurr==='USD') return (r.JPY_TWD/r.USD_TWD)?.toFixed(6);
  return null;
}

function confirmDeleteBank(id,name,cnt) {
  const msg=cnt>0?`刪除「${name}」將同時刪除底下 ${cnt} 個帳戶的資料。此操作無法復原。`:`確定要刪除「${name}」嗎？`;

    t.objectStore('banks').delete(id);

  });

  const shares = parseFloat(document.getElementById('holdingShares').value)||0;
  const assetType = document.getElementById('holdingAssetType').value;
  const market = document.getElementById('holdingMarket').value||'TW';
  const currency = document.getElementById('holdingCurrency').value||(market==='TW'?'TWD':'USD');
  const manualPrice = parseFloat(document.getElementById('holdingManualPrice').value)||null;
  const editId = document.getElementById('holdingEditId').value;

  if (!brokId){document.getElementById('holdingBrokId').style.borderColor='var(--red)';return;}
  if (!ticker){document.getElementById('holdingTicker').style.borderColor='var(--red)';return;}
  if (!name){document.getElementById('holdingName').style.borderColor='var(--red)';return;}

  await putOne(db,'holdings',{
    id: editId||crypto.randomUUID(),
    brokerage_id: brokId,
    ticker, name,
    market, asset_type: assetType,
    currency, shares,
    manual_price: manualPrice,
  });

  document.getElementById('holdingModal').classList.remove('open');
  showToast(editId?'持倉已更新':'持倉已新增');
  await renderHoldings();
});

// ════════════════════════════════════════════════════════════════════════════
// RECV MODAL
// ════════════════════════════════════════════════════════════════════════════
function openRecvModal(r=null) {
  document.getElementById('recvModalTitle').textContent = r?'編輯應收款':'新增應收款';
  document.getElementById('recvEditId').value = r?.id??'';
  document.getElementById('recvName').value = r?.name??'';
  document.getElementById('recvTotal').value = r?.total_amount??'';
  document.getElementById('recvReceived').value = r?.received_amount??0;
  document.getElementById('recvNote2').value = r?.note??'';
  document.getElementById('recvModal').classList.add('open');
  document.getElementById('recvName').focus();
}
document.getElementById('recvModalCancel').addEventListener('click',()=>document.getElementById('recvModal').classList.remove('open'));
document.getElementById('recvModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});
document.getElementById('recvModalSave').addEventListener('click',async()=>{
  const name=document.getElementById('recvName').value.trim();
  const total=parseFloat(document.getElementById('recvTotal').value)||0;
  const received=parseFloat(document.getElementById('recvReceived').value)||0;
  const note=document.getElementById('recvNote2').value.trim();
  const editId=document.getElementById('recvEditId').value;
  if(!name){document.getElementById('recvName').style.borderColor='var(--red)';return;}
  await putOne(db,'receivables',{
    id:editId||crypto.randomUUID(),
    name,total_amount:total,received_amount:received,
    currency:'TWD',note,
    is_settled:received>=total&&total>0,
    created_at:new Date().toISOString(),
  });
  document.getElementById('recvModal').classList.remove('open');
  showToast(editId?'應收款已更新':'應收款已新增');
  await renderSettings();
});

// ════════════════════════════════════════════════════════════════════════════
// IMPORT / EXPORT
// ════════════════════════════════════════════════════════════════════════════
const BACKUP_STORES=['banks','accounts','time_deposits','brokerages','holdings','market_prices','gold_holdings','receivables','fx_rates','settings','transfer_logs'];

document.getElementById('exportBtn').addEventListener('click',async()=>{
  const backup={version:1,exported_at:new Date().toISOString(),data:{}};
  for(const s of BACKUP_STORES) backup.data[s]=await getAll(db,s).catch(()=>[]);
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`pfcc-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click',()=>{
  document.getElementById('importFile').value='';
  document.getElementById('importStatus').textContent='';
  document.getElementById('importModalConfirm').disabled=true;
  document.getElementById('importModal').classList.add('open');
});
document.getElementById('importModalCancel').addEventListener('click',()=>document.getElementById('importModal').classList.remove('open'));
document.getElementById('importModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});

let _importData=null;
document.getElementById('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const statusEl=document.getElementById('importStatus');
  try{
    const parsed=JSON.parse(await file.text());
    if(!parsed?.version||!parsed?.data)throw new Error('不是有效的 PFCC 備份檔案');
    _importData=parsed;
    statusEl.style.color='var(--green)';statusEl.textContent=`✓ 備份日期 ${parsed.exported_at?.slice(0,10)??'未知'}`;
    document.getElementById('importModalConfirm').disabled=false;
  }catch(err){
    _importData=null;statusEl.style.color='var(--red)';statusEl.textContent=`✗ ${err.message}`;
    document.getElementById('importModalConfirm').disabled=true;
  }
});
document.getElementById('importModalConfirm').addEventListener('click',async()=>{
  if(!_importData)return;
  document.getElementById('importModal').classList.remove('open');
  for(const s of BACKUP_STORES){const records=_importData.data[s]??[];if(records.length>0)await putMany(db,s,records).catch(()=>{});}
  _importData=null;showToast('備份已匯入');await navigate(currentView);
});

// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

function updateLastUpdated(fxRates) {
  const el=document.getElementById('lastUpdated');
  if(el&&fxRates.usd_fetched_at)el.textContent='匯率 '+relativeTime(fxRates.usd_fetched_at);
}

function relativeTime(iso) {
  const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1)return'剛剛';if(mins<60)return`${mins} 分鐘前`;
  const hrs=Math.round(mins/60);if(hrs<24)return`${hrs} 小時前`;
  return fmtDate(iso);
}

function fmtShortTime(iso) {
  const d = new Date(iso);
  const M = d.getMonth()+1, D = d.getDate();
  const h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
  return `${M}/${D} ${h}:${m}`;
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// Mobile menu
const menuBtn=document.getElementById('menuBtn');
const sidebar=document.getElementById('sidebar');
function checkMobile(){menuBtn.style.display=window.innerWidth<=768?'flex':'none';}
checkMobile();window.addEventListener('resize',checkMobile);
menuBtn.addEventListener('click',()=>sidebar.classList.toggle('open'));
document.addEventListener('click',e=>{if(!sidebar.contains(e.target)&&!menuBtn.contains(e.target))sidebar.classList.remove('open');});

// Start
init().catch(err=>{
  document.getElementById('content').innerHTML=`<div style="color:var(--red);padding:40px"><strong>載入失敗</strong><br><small>${err.message}</small></div>`;
  console.error(err);
});
</script>
