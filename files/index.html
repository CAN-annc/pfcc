<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>PFCC — 個人財務控制台</title>
<script src="/register-sw.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1B2D;--navy-mid:#1A2E48;--navy-light:#243D5C;
  --blue:#2563EB;--blue-soft:#3B82F6;
  --surface:#F7F8FA;--surface-2:#EDEEF1;
  --border:#DDE0E7;--border-2:#C8CDD8;
  --text-1:#111827;--text-2:#4B5563;--text-3:#9CA3AF;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --sidebar-w:220px;--header-h:56px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang TC','Noto Sans TC',sans-serif;
  font-size:14px;color:var(--text-1);background:var(--surface);-webkit-font-smoothing:antialiased;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body{display:flex;min-height:100dvh}
.sidebar{width:var(--sidebar-w);min-height:100dvh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;transition:transform .25s ease}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--navy-light);display:flex;align-items:center;gap:10px}
.sidebar-logo-text{font-size:13px;font-weight:600;color:#E2E8F0;letter-spacing:.04em}
.sidebar-logo-sub{font-size:10px;color:#64748B;margin-top:1px}
.nav{padding:12px 0;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:500;color:#475569;letter-spacing:.08em;padding:16px 20px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:#94A3B8;cursor:pointer;border-left:2px solid transparent;transition:background .15s,color .15s;text-decoration:none}
.nav-item:hover{background:var(--navy-light);color:#CBD5E1}
.nav-item.active{color:#F1F5F9;background:var(--navy-mid);border-left-color:var(--blue-soft)}
.nav-item.disabled{opacity:.35;cursor:default;pointer-events:none}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.topbar-right{display:flex;align-items:center;gap:8px}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1100px}

/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.card-total{font-size:14px;font-weight:600}

/* Net Worth */
.networth-card{background:var(--navy);border-radius:12px;padding:28px 28px 24px;color:#fff}
.networth-label{font-size:12px;color:#94A3B8;font-weight:500;letter-spacing:.04em;margin-bottom:8px}
.networth-amount{font-size:40px;font-weight:300;letter-spacing:-1.5px;line-height:1;color:#F1F5F9}
.networth-currency{font-size:16px;font-weight:400;color:#64748B;margin-right:4px}
.networth-breakdown{display:flex;gap:0;margin-top:24px;border-top:1px solid var(--navy-light);padding-top:20px}
.networth-item{flex:1;padding:0 20px 0 0}
.networth-item:not(:last-child){border-right:1px solid var(--navy-light);margin-right:20px}
.networth-item-label{font-size:11px;color:#64748B;margin-bottom:5px}
.networth-item-value{font-size:16px;font-weight:500;color:#E2E8F0}
.networth-item-sub{font-size:11px;color:#475569;margin-top:2px}
.freshness-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 28px;background:var(--navy-mid);border-radius:0 0 12px 12px;margin-top:-1px;font-size:11px;color:#64748B}
.freshness-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fresh{background:#10B981}.stale{background:var(--amber)}.missing{background:var(--red)}

/* Expandable rows */
.section-row{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;user-select:none}
.section-row:last-child{border-bottom:none}
.section-row:hover{background:var(--surface)}
.row-left{display:flex;align-items:center;gap:10px;flex:1}
.row-right{display:flex;align-items:center;gap:12px;text-align:right}
.row-label{font-size:13px;font-weight:500}
.row-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.row-amount{font-size:13px;font-weight:600}
.chevron{width:16px;height:16px;color:var(--text-3);transition:transform .2s ease;flex-shrink:0}
.expanded .chevron{transform:rotate(90deg)}
.sub-rows{display:none;background:var(--surface)}
.sub-rows.open{display:block}
.sub-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 10px 44px;border-top:1px solid var(--border);font-size:12px}
.sub-row-label{color:var(--text-2)}
.sub-row-right{display:flex;align-items:center;gap:8px;text-align:right}
.sub-row-amount{font-weight:500;color:var(--text-1)}
.sub-row-original{font-size:10px;color:var(--text-3)}

/* Badges */
.curr-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.03em;flex-shrink:0}
.curr-TWD{background:#DCFCE7;color:#166534}
.curr-USD{background:#DBEAFE;color:#1E40AF}
.curr-JPY{background:#FEF9C3;color:#854D0E}
.bank-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.icon-circle{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-blue{background:#EFF6FF;color:var(--blue)}
.ic-green{background:var(--green-bg);color:var(--green)}
.ic-amber{background:var(--amber-bg);color:var(--amber)}
.ic-navy{background:var(--navy-light);color:#93C5FD}

/* Receivables */
.recv-card{border:1px solid #FDE68A;background:var(--amber-bg);border-radius:10px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px}
.recv-card-body{flex:1}
.recv-card-title{font-size:13px;font-weight:600;color:#92400E;margin-bottom:4px}
.recv-card-desc{font-size:12px;color:#B45309}

/* Stale / price */
.stale-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--amber-bg);color:var(--amber)}
.enter-price-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border-2);background:#fff;cursor:pointer;color:var(--text-2)}
.enter-price-btn:hover{background:var(--surface-2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1D4ED8}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-icon{padding:7px}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-sm{padding:5px 10px;font-size:12px}

/* Updated at */
.updated-at{font-size:11px;color:var(--text-3)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:min(480px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90dvh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{font-size:12px;color:var(--text-2);display:block;margin-bottom:5px;font-weight:500}
.modal-field input,.modal-field select{width:100%;padding:9px 12px;border:1px solid var(--border-2);border-radius:7px;font-size:14px;outline:none;transition:border-color .15s;background:#fff}
.modal-field input:focus,.modal-field select:focus{border-color:var(--blue)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,#E5E7EB 25%,#F3F4F6 50%,#E5E7EB 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px;display:inline-block}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Settings page */
.settings-section{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.settings-section-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.settings-section-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row:hover{background:var(--surface)}
.settings-row-left{flex:1}
.settings-row-name{font-size:13px;font-weight:500;color:var(--text-1)}
.settings-row-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.settings-row-actions{display:flex;align-items:center;gap:8px}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.empty-state{padding:32px 18px;text-align:center;color:var(--text-3)}
.empty-state-icon{margin-bottom:8px;opacity:.4}
.empty-state p{font-size:13px}

/* Transfer panel */
.transfer-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.transfer-arrow{display:flex;align-items:center;justify-content:center;padding:8px 0;color:var(--text-3)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* Responsive */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  .sidebar{transform:translateX(-220px);width:220px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:16px}
  .networth-breakdown{flex-direction:column;gap:12px}
  .networth-item:not(:last-child){border-right:none;padding-right:0;margin-right:0;border-bottom:1px solid var(--navy-light);padding-bottom:12px}
  .networth-amount{font-size:30px}
  .field-row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="7" fill="#2563EB" opacity=".15"/>
      <path d="M7 14h14M14 7v14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="3" fill="#3B82F6"/>
    </svg>
    <div>
      <div class="sidebar-logo-text">PFCC</div>
      <div class="sidebar-logo-sub">個人財務控制台</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-section">總覽</div>
    <a class="nav-item" href="#" data-view="assets">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      資產總覽
    </a>
    <div class="nav-section">記帳</div>
    <a class="nav-item disabled">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      新增記帳
    </a>
    <div class="nav-section">管理</div>
    <a class="nav-item" href="#" data-view="settings">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      帳戶設定
    </a>
    <a class="nav-item" href="#" data-view="transfer">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
      帳戶移轉
    </a>
    <a class="nav-item disabled">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M7 21l5-5 5 5M7 3l5 5 5-5"/></svg>
      投資持倉
    </a>
  </div>
</nav>

<!-- ── Main ─────────────────────────────────────────────────────────────────── -->
<div class="main">
  <header class="topbar">
    <button class="btn btn-ghost btn-icon" id="menuBtn" aria-label="選單" style="display:none">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title" id="topbarTitle">資產總覽</span>
    <div class="topbar-right">
      <span class="updated-at" id="lastUpdated"></span>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="更新報價與匯率">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4 9a8 8 0 0115 3M20 15a8 8 0 01-15-3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯出備份" id="exportBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="匯入備份" id="importBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </button>
    </div>
  </header>
  <div class="content" id="content">
    <div style="color:var(--text-3);padding:40px 0;text-align:center">
      <div class="skeleton" style="width:200px;height:20px;margin:0 auto 12px"></div>
      <div class="skeleton" style="width:140px;height:14px;margin:0 auto"></div>
    </div>
  </div>
</div>

<!-- ── Toast ────────────────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<!-- ── Balance modal ────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="balanceModal">
  <div class="modal">
    <h2 id="balanceModalTitle">更新餘額</h2>
    <div class="modal-field">
      <label id="balanceModalLabel">目前餘額</label>
      <input type="number" id="balanceModalInput" placeholder="輸入最新餘額" min="0" step="0.01">
    </div>
    <div style="font-size:11px;color:var(--text-3)">系統記錄最後更新時間，不影響交易紀錄。</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="balanceModalCancel">取消</button>
      <button class="btn btn-primary" id="balanceModalSave">確認更新</button>
    </div>
  </div>
</div>

<!-- ── Add/Edit Bank modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="bankModal">
  <div class="modal">
    <h2 id="bankModalTitle">新增銀行</h2>
    <div class="modal-field">
      <label>銀行名稱</label>
      <input type="text" id="bankName" placeholder="例：中國信託">
    </div>
    <div class="modal-field">
      <label>顏色標記</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="bankColorPicker"></div>
    </div>
    <input type="hidden" id="bankEditId">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bankModalCancel">取消</button>
      <button class="btn btn-primary" id="bankModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Add/Edit Account modal ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="accountModal">
  <div class="modal">
    <h2 id="accountModalTitle">新增帳戶</h2>
    <div class="modal-field">
      <label>所屬銀行</label>
      <select id="accountBankId">
        <option value="">── 現金（不屬於任何銀行）──</option>
      </select>
    </div>
    <div class="modal-field">
      <label>帳戶名稱</label>
      <input type="text" id="accountName" placeholder="例：台幣活存">
    </div>
    <div class="field-row">
      <div class="modal-field">
        <label>帳戶類型</label>
        <select id="accountType">
          <option value="checking">活存 / 帳戶</option>
          <option value="savings">儲蓄存款</option>
          <option value="foreign">外幣帳戶</option>
          <option value="cash">現金</option>
        </select>
      </div>
      <div class="modal-field">
        <label>幣別</label>
        <select id="accountCurrency">
          <option value="TWD">TWD 台幣</option>
          <option value="USD">USD 美元</option>
          <option value="JPY">JPY 日圓</option>
        </select>
      </div>
    </div>
    <div class="modal-field">
      <label>目前餘額</label>
      <input type="number" id="accountBalance" placeholder="0" min="0" step="0.01">
    </div>
    <input type="hidden" id="accountEditId">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="accountModalCancel">取消</button>
      <button class="btn btn-primary" id="accountModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Delete confirm modal ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2 id="deleteModalTitle">確認刪除</h2>
    <p id="deleteModalMsg" style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:4px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteModalCancel">取消</button>
      <button class="btn btn-danger" id="deleteModalConfirm">確認刪除</button>
    </div>
  </div>
</div>

<!-- ── Price modal ──────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="priceModal">
  <div class="modal">
    <h2 id="priceModalTitle">輸入參考價格</h2>
    <div class="modal-field">
      <label id="priceModalLabel">股票代號</label>
      <input type="number" id="priceModalInput" placeholder="輸入目前參考價格" min="0" step="0.01">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="priceModalCancel">取消</button>
      <button class="btn btn-primary" id="priceModalSave">儲存</button>
    </div>
  </div>
</div>

<!-- ── Import modal ─────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>從備份匯入</h2>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6">
      選擇先前匯出的 <code style="background:var(--surface-2);padding:1px 5px;border-radius:3px">.json</code> 備份檔案。
      <strong>匯入後將覆蓋目前裝置上的所有資料。</strong>
    </p>
    <input type="file" id="importFile" accept=".json"
      style="font-size:13px;color:var(--text-2);border:1px dashed var(--border-2);border-radius:7px;padding:12px;width:100%;cursor:pointer">
    <div id="importStatus" style="font-size:12px;margin-top:8px;min-height:20px"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="importModalCancel">取消</button>
      <button class="btn btn-primary" id="importModalConfirm" disabled>匯入並覆蓋</button>
    </div>
  </div>
</div>

<script type="module">
import { openDB, seedIfNeeded, getAll, getOne, putOne, putMany, getSetting } from './db.js';
import { refreshPrices, refreshFxRates, getFxRates, setManualPrice } from './market.js';
import {
  calcCashAssets, calcDepositAssets, calcInvestmentAssets,
  calcReceivables, calcNetWorth,
  fmt, fmtCurrency, fmtDate, fmtDateTime, daysUntil, toTWD,
} from './calc.js';

// ─── State ───────────────────────────────────────────────────────────────────
let db, state = {}, currentView = 'assets';

// ─── Bootstrap ───────────────────────────────────────────────────────────────
async function init() {
  db = await openDB();
  await seedIfNeeded(db);
  setupNav();
  await navigate('assets');
  refreshMarketData().catch(e => console.warn('[init] market refresh:', e));
}

// ─── Navigation ──────────────────────────────────────────────────────────────
function setupNav() {
  document.querySelectorAll('.nav-item[data-view]').forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      navigate(item.dataset.view);
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

async function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-item[data-view]').forEach(i =>
    i.classList.toggle('active', i.dataset.view === view)
  );
  const titles = { assets: '資產總覽', settings: '帳戶設定', transfer: '帳戶移轉' };
  document.getElementById('topbarTitle').textContent = titles[view] ?? view;
  document.getElementById('refreshBtn').style.display = view === 'assets' ? '' : 'none';

  if (view === 'assets') await renderAssets();
  else if (view === 'settings') await renderSettings();
  else if (view === 'transfer') await renderTransfer();
}

// ─── Load data ───────────────────────────────────────────────────────────────
async function loadData() {
  const [banks, accounts, deposits, brokerages, holdings, goldHoldings,
         receivables, prices] = await Promise.all([
    getAll(db, 'banks'),
    getAll(db, 'accounts'),
    getAll(db, 'time_deposits'),
    getAll(db, 'brokerages'),
    getAll(db, 'holdings'),
    getAll(db, 'gold_holdings'),
    getAll(db, 'receivables'),
    getAll(db, 'market_prices'),
  ]);
  const fxRates = await getFxRates(db);
  const cash       = calcCashAssets(accounts, banks, fxRates);
  const depositRes = calcDepositAssets(deposits, banks, fxRates);
  const inv        = calcInvestmentAssets(holdings, brokerages, prices, fxRates);
  const recv       = calcReceivables(receivables);
  const netWorth   = calcNetWorth({ cashTWD: cash.totalTWD, depositTWD: depositRes.totalTWD, investmentTWD: inv.totalTWD });
  state = { banks, accounts, deposits, brokerages, holdings, prices,
            goldHoldings, receivables, fxRates, cash, depositRes, inv, recv, netWorth };
}

async function refreshMarketData() {
  const holdings = state?.holdings ?? [];
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.style.opacity = '.4'; btn.style.pointerEvents = 'none'; }
  await Promise.allSettled([
    refreshFxRates(db).catch(e => console.warn('[FX]', e)),
    refreshPrices(db, holdings).catch(e => console.warn('[prices]', e)),
  ]);
  if (btn) { btn.style.opacity = ''; btn.style.pointerEvents = ''; }
  if (currentView === 'assets') await renderAssets();
}

// VIEW: ASSETS
// ════════════════════════════════════════════════════════════════════════════
async function renderAssets() {
  await loadData();
  const { netWorth, cash, depositRes, inv, recv, fxRates } = state;
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(buildNetWorth(netWorth, cash, depositRes, inv, fxRates));
  if (recv.pending.length > 0) content.appendChild(buildReceivables(recv));
  content.appendChild(buildCashSection(cash, fxRates));
  if (depositRes.items.length > 0) content.appendChild(buildDepositsSection(depositRes));
  content.appendChild(buildInvestmentSection(inv));
  updateLastUpdated(fxRates);
}

function buildNetWorth(netWorth, cash, depositRes, inv, fxRates) {
  const wrap = el('div');
  const card = el('div', 'networth-card');
  card.innerHTML = `
    <div class="networth-label">總資產（折合台幣）</div>
    <div class="networth-amount"><span class="networth-currency">NT$</span>${fmt(netWorth)}</div>
    <div class="networth-breakdown">
      <div class="networth-item">
        <div class="networth-item-label">現金 &amp; 存款</div>
        <div class="networth-item-value">NT$ ${fmt(cash.totalTWD)}</div>
        <div class="networth-item-sub">${Object.entries(cash.byCurrency).filter(([,v])=>v>0).map(([c,v])=>`${c} ${fmt(v,{currency:c})}`).join('　')}</div>
      </div>
      <div class="networth-item">
        <div class="networth-item-label">定存</div>
        <div class="networth-item-value">NT$ ${fmt(depositRes.totalTWD)}</div>
        <div class="networth-item-sub">${depositRes.items.length} 筆</div>
      </div>
      <div class="networth-item">
        <div class="networth-item-label">投資資產</div>
        <div class="networth-item-value">NT$ ${fmt(inv.totalTWD)}</div>
        <div class="networth-item-sub">${inv.hasMissingPrices ? '⚠ 部分持倉未估值' : `${inv.enriched.length} 支持倉`}</div>
      </div>
    </div>`;
  wrap.appendChild(card);
  const bar = el('div', 'freshness-bar');
  const usdAge = fxRates.usd_fetched_at ? relativeTime(fxRates.usd_fetched_at) : '未取得';
  bar.innerHTML = `
    <span class="freshness-dot ${fxRates.is_stale ? 'stale' : 'fresh'}"></span>
    <span>匯率更新：${usdAge}</span>
    <span style="color:#334155;margin:0 4px">·</span>
    <span style="color:#475569">US$1 ≈ NT$${fxRates.USD_TWD}</span>
    <span style="color:#334155;margin:0 4px">·</span>
    <span style="color:#475569">¥100 ≈ NT$${(fxRates.JPY_TWD * 100).toFixed(2)}</span>
    ${fxRates.is_stale ? '<span class="stale-badge" style="margin-left:4px">匯率可能過時</span>' : ''}`;
  wrap.appendChild(bar);
  return wrap;
}

function buildReceivables({ pending, totalTWD }) {
  const card = el('div', 'recv-card');
  card.innerHTML = `
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#D97706" stroke-width="1.8" style="flex-shrink:0;margin-top:2px"><path d="M12 9v3m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
    <div class="recv-card-body">
      <div class="recv-card-title">應收款 NT$ ${fmt(totalTWD)}（未計入總資產）</div>
      <div class="recv-card-desc">${pending.map(r=>`${r.name}：NT$ ${fmt(r.total_amount - r.received_amount)}`).join('　')}</div>
    </div>`;
  return card;
}

function buildCashSection(cash, fxRates) {
  const card = el('div', 'card');
  card.innerHTML = `<div class="card-header"><div class="card-title"><div class="icon-circle ic-blue"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>現金 &amp; 銀行帳戶</div><div class="card-total">NT$ ${fmt(cash.totalTWD)}</div></div>`;

  const bankGroups = Object.values(cash.byBank).sort((a,b)=>(a.bank.sort_order??99)-(b.bank.sort_order??99));
  const currRows = Object.entries(cash.byCurrency).filter(([,v])=>v>0);
  if (currRows.length > 1) {
    const s = el('div'); s.style.cssText='padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)';
    s.innerHTML = currRows.map(([c,v])=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px"><span class="curr-badge curr-${c}">${c}</span><span style="font-size:12px;color:var(--text-2)">${fmt(v,{currency:c})}</span></span>`).join('');
    card.appendChild(s);
  }
  if (bankGroups.length === 0) {
    const e = el('div'); e.style.cssText='padding:32px 18px;text-align:center;color:var(--text-3);font-size:13px';
    e.textContent = '尚無帳戶。前往「帳戶設定」新增銀行與帳戶。';
    card.appendChild(e);
    return card;
  }
  bankGroups.forEach(({ bank, accounts, totalTWD }) => {
    const groupId = 'bank_' + bank.id;
    const row = el('div', 'section-row');
    row.dataset.target = groupId;
    const hasForeign = accounts.some(a => a.currency !== 'TWD');
    row.innerHTML = `
      <div class="row-left">
        <span class="bank-dot" style="background:${bank.color??'#6B7280'}"></span>
        <div>
          <div class="row-label">${bank.name}</div>
          ${hasForeign ? `<div class="row-sub">${accounts.map(a=>a.currency!=='TWD'?`<span class="curr-badge curr-${a.currency}" style="margin-right:3px">${a.currency}</span>`:'').join('')}</div>` : ''}
        </div>
      </div>
      <div class="row-right">
        <div style="text-align:right">
          <div class="row-amount">NT$ ${fmt(totalTWD)}</div>
          ${accounts.length > 1 ? `<div class="row-sub">${accounts.length} 個帳戶</div>` : ''}
        </div>
        <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    card.appendChild(row);
    const sub = el('div', 'sub-rows'); sub.id = groupId;
    accounts.forEach(acc => {
      const subRow = el('div', 'sub-row');
      subRow.style.cursor = 'pointer'; subRow.title = '點擊更新餘額';
      const isForeign = acc.currency !== 'TWD';
      subRow.innerHTML = `
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
          <span class="sub-row-label">${acc.name}</span>
          ${acc.updated_at ? `<span style="font-size:10px;color:var(--text-3);margin-left:6px">${relativeTime(acc.updated_at)}</span>` : ''}
        </div>
        <div class="sub-row-right">
          ${isForeign ? `<span class="sub-row-original">${acc.currency} ${fmt(acc.balance,{currency:acc.currency})}</span>` : ''}
          <span class="sub-row-amount">${acc.currency==='TWD'?'NT$':'≈ NT$'} ${fmt(acc.balTWD)}</span>
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="var(--text-3)" stroke-width="2" style="flex-shrink:0;opacity:.6"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>`;
      subRow.addEventListener('click', e => { e.stopPropagation(); openBalanceModal(acc.id, acc.name, acc.currency, acc.balance); });
      sub.appendChild(subRow);
    });
    card.appendChild(sub);
    row.addEventListener('click', () => toggleSection(row, sub));
  });
  return card;
}

function buildDepositsSection({ items, totalTWD }) {
  const card = el('div', 'card');
  card.innerHTML = `<div class="card-header"><div class="card-title"><div class="icon-circle ic-amber"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></div>定存</div><div class="card-total">NT$ ${fmt(totalTWD)}</div></div>`;
  items.forEach(dep => {
    const days = daysUntil(dep.maturity_date);
    const urgency = days != null && days <= 30 ? 'color:var(--amber)' : 'color:var(--text-3)';
    const row = el('div', 'section-row'); row.style.cursor='default';
    row.innerHTML = `
      <div class="row-left"><div>
        <div class="row-label">${dep.bank?.name??''} ${dep.label}</div>
        <div class="row-sub">到期：${fmtDate(dep.maturity_date)} ${days!=null?`<span style="${urgency}">（${days===0?'今天':days+' 天後'}）</span>`:''}
        </div>
      </div></div>
      <div class="row-right"><div style="text-align:right">
        <div class="row-amount">${dep.currency} ${fmt(dep.principal,{currency:dep.currency})}</div>
        <div class="row-sub">≈ NT$ ${fmt(dep.principalTWD)}</div>
      </div></div>`;
    card.appendChild(row);
  });
  return card;
}

function buildInvestmentSection({ byMarket, totalTWD, hasMissingPrices }) {
  const card = el('div', 'card');
  card.innerHTML = `<div class="card-header"><div class="card-title"><div class="icon-circle ic-navy"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>投資資產${hasMissingPrices?'<span class="stale-badge" style="margin-left:6px">部分缺價格</span>':''}</div><div class="card-total">NT$ ${fmt(totalTWD)}</div></div>`;

  ['TW','US'].forEach(market => {
    const group = byMarket[market]; if (!group) return;
    const label = market === 'TW' ? '台股' : '美股';
    const groupId = 'inv_' + market;
    const row = el('div', 'section-row'); row.dataset.target = groupId;
    row.innerHTML = `
      <div class="row-left">
        <span class="curr-badge curr-${market==='TW'?'TWD':'USD'}" style="font-size:11px">${label}</span>
        <span style="font-size:12px;color:var(--text-2)">${group.holdings.length} 支持倉</span>
      </div>
      <div class="row-right">
        <div class="row-amount">NT$ ${fmt(group.totalTWD)}</div>
        <svg class="chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    card.appendChild(row);
    const sub = el('div', 'sub-rows'); sub.id = groupId;
    const brokGroups = {};
    group.holdings.forEach(h => {
      if (!brokGroups[h.brokerage_id]) brokGroups[h.brokerage_id] = { brokerage: h.brokerage, holdings: [] };
      brokGroups[h.brokerage_id].holdings.push(h);
    });
    Object.values(brokGroups).forEach(({ brokerage, holdings: bh }) => {
      const bh2 = el('div', 'sub-row');
      bh2.style.cssText='background:var(--surface-2);font-size:11px;color:var(--text-3);font-weight:600;padding-left:18px;border-top:1px solid var(--border)';
      bh2.innerHTML = `<span>${brokerage?.name??'—'}</span>`;
      sub.appendChild(bh2);
      bh.forEach(h => {
        const sr = el('div', 'sub-row');
        const needsPrice = h.needsPriceUpdate || h.price == null;
        sr.innerHTML = `
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:12px;font-weight:600">${h.ticker}</span>
              <span class="sub-row-label">${h.name}</span>
            </div>
            <div class="sub-row-original">${h.shares} 股</div>
          </div>
          <div class="sub-row-right">
            ${needsPrice
              ? `<button class="enter-price-btn" data-ticker="${h.ticker}" data-market="${h.market}" data-name="${h.name}">輸入價格</button>`
              : `<div style="text-align:right">
                  <div class="sub-row-amount">${h.currency} ${fmt(h.marketValueLocal,{currency:h.currency})}</div>
                  <div style="font-size:10px;color:var(--text-3)">@ ${h.price}${h.priceFetchedAt?' · '+fmtDateTime(h.priceFetchedAt):''}</div>
                </div>`}
          </div>`;
        sub.appendChild(sr);
      });
    });
    card.appendChild(sub);
    row.addEventListener('click', () => toggleSection(row, sub));
  });
  card.querySelectorAll('.enter-price-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openPriceModal(btn.dataset.ticker, btn.dataset.market, btn.dataset.name); });
  });
  return card;
}

// VIEW: SETTINGS
// ════════════════════════════════════════════════════════════════════════════
async function renderSettings() {
  await loadData();
  const { banks, accounts } = state;
  const content = document.getElementById('content');
  content.innerHTML = '';

  // ── Banks section ──────────────────────────────────────────────────────────
  const bankSec = el('div', 'settings-section');
  const bankHeader = el('div', 'settings-section-header');
  bankHeader.innerHTML = `<div class="settings-section-title"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V12h6v9"/></svg>銀行</div>`;
  const addBankBtn = el('button', 'btn btn-ghost btn-sm');
  addBankBtn.innerHTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 新增銀行`;
  addBankBtn.addEventListener('click', () => openBankModal());
  bankHeader.appendChild(addBankBtn);
  bankSec.appendChild(bankHeader);

  if (banks.length === 0) {
    const e = el('div', 'empty-state'); e.innerHTML = `<div class="empty-state-icon"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V12h6v9"/></svg></div><p>尚無銀行，點上方按鈕新增</p>`;
    bankSec.appendChild(e);
  } else {
    banks.sort((a,b)=>(a.sort_order??99)-(b.sort_order??99)).forEach(bank => {
      const accCount = accounts.filter(a => a.bank_id === bank.id).length;
      const row = el('div', 'settings-row');
      row.innerHTML = `
        <div class="settings-row-left">
          <div class="settings-row-name" style="display:flex;align-items:center;gap:8px">
            <span class="color-dot" style="background:${bank.color??'#6B7280'}"></span>
            ${bank.name}
          </div>
          <div class="settings-row-sub">${accCount} 個帳戶</div>
        </div>
        <div class="settings-row-actions">
          <button class="btn btn-ghost btn-sm" data-edit-bank="${bank.id}">編輯</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--red)" data-del-bank="${bank.id}" data-del-bank-name="${bank.name}" data-del-bank-count="${accCount}">刪除</button>
        </div>`;
      row.querySelector(`[data-edit-bank]`).addEventListener('click', () => openBankModal(bank));
      row.querySelector(`[data-del-bank]`).addEventListener('click', () => confirmDeleteBank(bank.id, bank.name, accCount));
      bankSec.appendChild(row);
    });
  }
  content.appendChild(bankSec);

  // ── Accounts section ───────────────────────────────────────────────────────
  const accSec = el('div', 'settings-section');
  const accHeader = el('div', 'settings-section-header');
  accHeader.innerHTML = `<div class="settings-section-title"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>帳戶與現金</div>`;
  const addAccBtn = el('button', 'btn btn-ghost btn-sm');
  addAccBtn.innerHTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 新增帳戶`;
  addAccBtn.addEventListener('click', () => openAccountModal(null, banks));
  accHeader.appendChild(addAccBtn);
  accSec.appendChild(accHeader);

  if (accounts.length === 0) {
    const e = el('div', 'empty-state'); e.innerHTML = `<div class="empty-state-icon"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div><p>尚無帳戶，點上方按鈕新增</p>`;
    accSec.appendChild(e);
  } else {
    const bankMap = Object.fromEntries(banks.map(b=>[b.id,b]));
    const typeLabel = { checking:'活存', savings:'儲蓄', foreign:'外幣', cash:'現金' };
    accounts.sort((a,b)=>{
      const ba = bankMap[a.bank_id]?.sort_order??99;
      const bb = bankMap[b.bank_id]?.sort_order??99;
      return ba - bb;
    }).forEach(acc => {
      const bank = bankMap[acc.bank_id];
      const row = el('div', 'settings-row');
      row.innerHTML = `
        <div class="settings-row-left">
          <div class="settings-row-name" style="display:flex;align-items:center;gap:8px">
            ${bank ? `<span class="color-dot" style="background:${bank.color??'#6B7280'}"></span>` : ''}
            ${bank ? bank.name + ' · ' : ''}${acc.name}
          </div>
          <div class="settings-row-sub" style="display:flex;align-items:center;gap:6px">
            <span class="curr-badge curr-${acc.currency}">${acc.currency}</span>
            ${typeLabel[acc.account_type]??acc.account_type}
            · 餘額 ${fmt(acc.balance,{currency:acc.currency})}
          </div>
        </div>
        <div class="settings-row-actions">
          <button class="btn btn-ghost btn-sm" data-edit-acc="${acc.id}">編輯</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--red)" data-del-acc="${acc.id}" data-del-acc-name="${acc.name}">刪除</button>
        </div>`;
      row.querySelector(`[data-edit-acc]`).addEventListener('click', () => openAccountModal(acc, banks));
      row.querySelector(`[data-del-acc]`).addEventListener('click', () => confirmDeleteAccount(acc.id, acc.name));
      accSec.appendChild(row);
    });
  }
  content.appendChild(accSec);
}

// VIEW: TRANSFER
// ════════════════════════════════════════════════════════════════════════════
async function renderTransfer() {
  await loadData();
  const { accounts, banks } = state;
  const content = document.getElementById('content');
  content.innerHTML = '';

  const panel = el('div', 'transfer-panel');
  const bankMap = Object.fromEntries(banks.map(b=>[b.id,b]));

  const accOptions = accounts.map(a => {
    const bank = bankMap[a.bank_id];
    const label = (bank ? bank.name + ' · ' : '') + a.name + ` (${a.currency} ${fmt(a.balance,{currency:a.currency})})`;
    return `<option value="${a.id}" data-currency="${a.currency}" data-balance="${a.balance}">${label}</option>`;
  }).join('');

  if (accounts.length < 2) {
    panel.innerHTML = `<div style="text-align:center;color:var(--text-3);padding:24px;font-size:13px">至少需要兩個帳戶才能使用移轉功能。<br>請先到「帳戶設定」新增帳戶。</div>`;
    content.appendChild(panel);
    return;
  }

  panel.innerHTML = `
    <h3 style="font-size:15px;font-weight:600;margin-bottom:20px">帳戶移轉</h3>
    <div class="modal-field">
      <label>從（來源帳戶）</label>
      <select id="transferFrom">${accOptions}</select>
    </div>
    <div class="transfer-arrow">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
    <div class="modal-field">
      <label>到（目標帳戶）</label>
      <select id="transferTo">${accOptions}</select>
    </div>
    <div class="modal-field" style="margin-top:4px">
      <label>移轉金額</label>
      <input type="number" id="transferAmount" placeholder="0" min="0.01" step="0.01">
    </div>
    <div id="transferNote" style="font-size:12px;color:var(--text-3);margin-top:4px;min-height:18px"></div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" id="transferConfirm" style="width:100%;justify-content:center">確認移轉</button>
    </div>
    <div id="transferHistory" style="margin-top:24px"></div>
  `;
  content.appendChild(panel);

  // Pre-select different accounts
  const toSel = document.getElementById('transferTo');
  if (toSel.options.length > 1) toSel.selectedIndex = 1;

  // Show currency warning when currencies differ
  function updateNote() {
    const fromSel = document.getElementById('transferFrom');
    const fromOpt = fromSel.options[fromSel.selectedIndex];
    const toOpt = toSel.options[toSel.selectedIndex];
    const noteEl = document.getElementById('transferNote');
    if (fromOpt.value === toOpt.value) {
      noteEl.style.color = 'var(--red)'; noteEl.textContent = '來源與目標帳戶不能相同';
    } else if (fromOpt.dataset.currency !== toOpt.dataset.currency) {
      noteEl.style.color = 'var(--amber)'; noteEl.textContent = `⚠ 幣別不同（${fromOpt.dataset.currency} → ${toOpt.dataset.currency}），金額將以原幣記錄，請確認已在銀行完成換匯。`;
    } else {
      noteEl.style.color = 'var(--text-3)'; noteEl.textContent = `來源餘額：${fromOpt.dataset.currency} ${fmt(parseFloat(fromOpt.dataset.balance),{currency:fromOpt.dataset.currency})}`;
    }
  }
  document.getElementById('transferFrom').addEventListener('change', updateNote);
  toSel.addEventListener('change', updateNote);
  updateNote();

  document.getElementById('transferConfirm').addEventListener('click', async () => {
    const fromId = document.getElementById('transferFrom').value;
    const toId   = document.getElementById('transferTo').value;
    const amount = parseFloat(document.getElementById('transferAmount').value);
    if (fromId === toId) { showToast('來源與目標帳戶不能相同'); return; }
    if (!amount || amount <= 0) { showToast('請輸入有效的移轉金額'); return; }

    const fromAcc = await getOne(db, 'accounts', fromId);
    const toAcc   = await getOne(db, 'accounts', toId);
    if (!fromAcc || !toAcc) return;

    await putOne(db, 'accounts', { ...fromAcc, balance: +(fromAcc.balance - amount).toFixed(6), updated_at: new Date().toISOString() });
    await putOne(db, 'accounts', { ...toAcc,   balance: +(toAcc.balance   + amount).toFixed(6), updated_at: new Date().toISOString() });

    document.getElementById('transferAmount').value = '';
    showToast(`✓ 已從「${fromAcc.name}」移轉 ${amount} 至「${toAcc.name}」`);
    await renderTransfer(); // re-render to show updated balances
  });
}

// ════════════════════════════════════════════════════════════════════════════
// BANK MODAL
// ════════════════════════════════════════════════════════════════════════════
const BANK_COLORS = ['#16803C','#DC2626','#DB2777','#B45309','#0369A1','#7C3AED','#0891B2','#EA580C','#475569'];
let _selectedBankColor = BANK_COLORS[0];

function openBankModal(bank = null) {
  document.getElementById('bankModalTitle').textContent = bank ? '編輯銀行' : '新增銀行';
  document.getElementById('bankName').value = bank?.name ?? '';
  document.getElementById('bankEditId').value = bank?.id ?? '';
  _selectedBankColor = bank?.color ?? BANK_COLORS[0];

  const picker = document.getElementById('bankColorPicker');
  picker.innerHTML = BANK_COLORS.map(c => `
    <button type="button" data-color="${c}" style="width:24px;height:24px;border-radius:50%;background:${c};border:3px solid ${c===_selectedBankColor?'#111':'transparent'};cursor:pointer;transition:border-color .15s"></button>
  `).join('');
  picker.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      _selectedBankColor = btn.dataset.color;
      picker.querySelectorAll('button').forEach(b => b.style.borderColor = b.dataset.color === _selectedBankColor ? '#111' : 'transparent');
    });
  });
  document.getElementById('bankModal').classList.add('open');
  document.getElementById('bankName').focus();
}

document.getElementById('bankModalCancel').addEventListener('click', () => document.getElementById('bankModal').classList.remove('open'));
document.getElementById('bankModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

document.getElementById('bankModalSave').addEventListener('click', async () => {
  const name = document.getElementById('bankName').value.trim();
  if (!name) { document.getElementById('bankName').style.borderColor='var(--red)'; return; }
  const editId = document.getElementById('bankEditId').value;
  const existing = editId ? await getOne(db, 'banks', editId) : null;
  const banks = await getAll(db, 'banks');
  const maxOrder = banks.reduce((m,b) => Math.max(m, b.sort_order??0), 0);
  await putOne(db, 'banks', {
    id: editId || crypto.randomUUID(),
    name, color: _selectedBankColor,
    short: name.slice(0,4),
    sort_order: existing?.sort_order ?? maxOrder + 1,
  });
  document.getElementById('bankModal').classList.remove('open');
  showToast(editId ? '銀行已更新' : '銀行已新增');
  await renderSettings();
});

function confirmDeleteBank(id, name, accCount) {
  const msg = accCount > 0
    ? `刪除「${name}」將同時刪除底下 ${accCount} 個帳戶的資料。此操作無法復原。`
    : `確定要刪除「${name}」嗎？此操作無法復原。`;
  openDeleteModal(msg, async () => {
    // Delete bank and all its accounts
    const accounts = await getAll(db, 'accounts');
    const t = db.transaction(['banks','accounts'], 'readwrite');
    t.objectStore('banks').delete(id);
    accounts.filter(a => a.bank_id === id).forEach(a => t.objectStore('accounts').delete(a.id));
    await new Promise((res,rej) => { t.oncomplete=res; t.onerror=()=>rej(t.error); });
    showToast('銀行已刪除');
    await renderSettings();
  });
}

// ════════════════════════════════════════════════════════════════════════════
// ACCOUNT MODAL
// ════════════════════════════════════════════════════════════════════════════
function openAccountModal(acc = null, banks = []) {
  document.getElementById('accountModalTitle').textContent = acc ? '編輯帳戶' : '新增帳戶';
  document.getElementById('accountEditId').value = acc?.id ?? '';
  document.getElementById('accountName').value = acc?.name ?? '';
  document.getElementById('accountType').value = acc?.account_type ?? 'checking';
  document.getElementById('accountCurrency').value = acc?.currency ?? 'TWD';
  document.getElementById('accountBalance').value = acc?.balance ?? '';

  const sel = document.getElementById('accountBankId');
  sel.innerHTML = `<option value="">── 現金（不屬於任何銀行）──</option>` +
    banks.sort((a,b)=>(a.sort_order??99)-(b.sort_order??99)).map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  sel.value = acc?.bank_id ?? '';

  document.getElementById('accountModal').classList.add('open');
  document.getElementById('accountName').focus();
}

document.getElementById('accountModalCancel').addEventListener('click', () => document.getElementById('accountModal').classList.remove('open'));
document.getElementById('accountModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

document.getElementById('accountModalSave').addEventListener('click', async () => {
  const name     = document.getElementById('accountName').value.trim();
  const bankId   = document.getElementById('accountBankId').value || null;
  const type     = document.getElementById('accountType').value;
  const currency = document.getElementById('accountCurrency').value;
  const balance  = parseFloat(document.getElementById('accountBalance').value) || 0;
  const editId   = document.getElementById('accountEditId').value;

  if (!name) { document.getElementById('accountName').style.borderColor='var(--red)'; return; }

  const existing = editId ? await getOne(db, 'accounts', editId) : null;
  await putOne(db, 'accounts', {
    id: editId || crypto.randomUUID(),
    bank_id: bankId, name, account_type: type,
    currency, balance,
    updated_at: new Date().toISOString(),
    ...(existing ?? {}),
    // override with new values
    bank_id: bankId, name, account_type: type, currency, balance,
    updated_at: new Date().toISOString(),
  });
  document.getElementById('accountModal').classList.remove('open');
  showToast(editId ? '帳戶已更新' : '帳戶已新增');
  await renderSettings();
});

function confirmDeleteAccount(id, name) {
  openDeleteModal(`確定要刪除帳戶「${name}」嗎？此操作無法復原。`, async () => {
    const t = db.transaction(['accounts'], 'readwrite');
    t.objectStore('accounts').delete(id);
    await new Promise((res,rej) => { t.oncomplete=res; t.onerror=()=>rej(t.error); });
    showToast('帳戶已刪除');
    await renderSettings();
  });
}

// ════════════════════════════════════════════════════════════════════════════
// DELETE MODAL
// ════════════════════════════════════════════════════════════════════════════
let _deleteCallback = null;
function openDeleteModal(msg, callback) {
  document.getElementById('deleteModalMsg').textContent = msg;
  _deleteCallback = callback;
  document.getElementById('deleteModal').classList.add('open');
}
document.getElementById('deleteModalCancel').addEventListener('click', () => document.getElementById('deleteModal').classList.remove('open'));
document.getElementById('deleteModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
document.getElementById('deleteModalConfirm').addEventListener('click', async () => {
  document.getElementById('deleteModal').classList.remove('open');
  if (_deleteCallback) await _deleteCallback();

});

// BALANCE MODAL
// ════════════════════════════════════════════════════════════════════════════
let _editAccId = null;
function openBalanceModal(accId, accName, currency, currentBalance) {
  _editAccId = accId;
  document.getElementById('balanceModalTitle').textContent = `更新餘額：${accName}`;
  document.getElementById('balanceModalLabel').textContent = `目前餘額（${currency}）`;
  document.getElementById('balanceModalInput').value = currentBalance;
  document.getElementById('balanceModal').classList.add('open');
  document.getElementById('balanceModalInput').focus();
  document.getElementById('balanceModalInput').select();
}
document.getElementById('balanceModalCancel').addEventListener('click', () => document.getElementById('balanceModal').classList.remove('open'));
document.getElementById('balanceModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
document.getElementById('balanceModalSave').addEventListener('click', async () => {
  const raw = parseFloat(document.getElementById('balanceModalInput').value);
  if (isNaN(raw) || raw < 0) { document.getElementById('balanceModalInput').style.borderColor='var(--red)'; return; }
  document.getElementById('balanceModal').classList.remove('open');
  const acc = await getOne(db, 'accounts', _editAccId);
  if (acc) {
    await putOne(db, 'accounts', { ...acc, balance: raw, updated_at: new Date().toISOString() });
    await renderAssets();
  }
});

// PRICE MODAL
// ════════════════════════════════════════════════════════════════════════════
let _modalTicker = null, _modalMarket = null;
function openPriceModal(ticker, market, name) {
  _modalTicker = ticker; _modalMarket = market;
  document.getElementById('priceModalTitle').textContent = `輸入參考價格：${ticker}`;
  document.getElementById('priceModalLabel').textContent = `${name}（${market === 'TW' ? 'TWD' : 'USD'}）`;
  document.getElementById('priceModalInput').value = '';
  document.getElementById('priceModal').classList.add('open');
  document.getElementById('priceModalInput').focus();
}
document.getElementById('priceModalCancel').addEventListener('click', () => document.getElementById('priceModal').classList.remove('open'));
document.getElementById('priceModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
document.getElementById('priceModalSave').addEventListener('click', async () => {
  const price = parseFloat(document.getElementById('priceModalInput').value);
  if (isNaN(price) || price <= 0) { document.getElementById('priceModalInput').style.borderColor='var(--red)'; return; }
  document.getElementById('priceModal').classList.remove('open');
  await setManualPrice(db, _modalTicker, _modalMarket, price);
  await renderAssets();
});

// ════════════════════════════════════════════════════════════════════════════
// IMPORT / EXPORT
// ════════════════════════════════════════════════════════════════════════════
const BACKUP_STORES = ['banks','accounts','time_deposits','brokerages','holdings','market_prices','gold_holdings','receivables','fx_rates','settings'];

document.getElementById('exportBtn').addEventListener('click', async () => {
  const backup = { version: 1, exported_at: new Date().toISOString(), data: {} };
  for (const s of BACKUP_STORES) backup.data[s] = await getAll(db, s);
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pfcc-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').value = '';
  document.getElementById('importStatus').textContent = '';
  document.getElementById('importModalConfirm').disabled = true;
  document.getElementById('importModal').classList.add('open');
});
document.getElementById('importModalCancel').addEventListener('click', () => document.getElementById('importModal').classList.remove('open'));
document.getElementById('importModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

let _importData = null;
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const statusEl = document.getElementById('importStatus');
  try {
    const parsed = JSON.parse(await file.text());
    if (!parsed?.version || !parsed?.data) throw new Error('不是有效的 PFCC 備份檔案');
    _importData = parsed;
    statusEl.style.color = 'var(--green)';
    statusEl.textContent = `✓ 備份日期 ${parsed.exported_at?.slice(0,10)??'未知'}`;
    document.getElementById('importModalConfirm').disabled = false;
  } catch (err) {
    _importData = null;
    statusEl.style.color = 'var(--red)'; statusEl.textContent = `✗ ${err.message}`;
    document.getElementById('importModalConfirm').disabled = true;
  }
});
document.getElementById('importModalConfirm').addEventListener('click', async () => {
  if (!_importData) return;
  document.getElementById('importModal').classList.remove('open');
  for (const s of BACKUP_STORES) {
    const records = _importData.data[s] ?? [];
    if (records.length > 0) await putMany(db, s, records);
  }
  _importData = null;
  showToast('備份已匯入');
  await navigate(currentView);
});

// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function toggleSection(row, sub) {
  const isOpen = sub.classList.contains('open');
  sub.classList.toggle('open', !isOpen);
  row.classList.toggle('expanded', !isOpen);
  row.setAttribute('aria-expanded', !isOpen);
}

function updateLastUpdated(fxRates) {
  const el = document.getElementById('lastUpdated');
  if (!el) return;
  el.textContent = fxRates.usd_fetched_at ? '匯率 ' + relativeTime(fxRates.usd_fetched_at) : '';
}

function relativeTime(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return '剛剛';
  if (mins < 60) return `${mins} 分鐘前`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} 小時前`;
  return fmtDate(iso);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Mobile menu
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
function checkMobile() { menuBtn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; }
checkMobile(); window.addEventListener('resize', checkMobile);
menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
document.addEventListener('click', e => { if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('open'); });

// ─── Start ───────────────────────────────────────────────────────────────────
init().catch(err => {
  document.getElementById('content').innerHTML =
    `<div style="color:var(--red);padding:40px"><strong>載入失敗</strong><br><small>${err.message}</small></div>`;
  console.error(err);
});
</script>
